<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="やることを書いて、終わったらチェック。シンプルな ToDo リスト。タスクは、この端末に保存されます。">
<meta name="theme-color" content="#f9faef" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Todo">
<title>Todo | SK's Toolbox</title>
<!-- 多言語: /lang/ で選んだ言語で表示する（/assets/i18n.js。body の最後で translatePage()） -->
<script src="/assets/i18n.js"></script>
<!-- 文字は M PLUS 1、アイコンは Material Symbols（Google のマテリアルデザイン） -->
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@300;400;500;700&display=swap" data-icons="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></script>
<link rel="stylesheet" href="/toolbox/shared/m3.css">
<link rel="stylesheet" href="todo.css">
<!-- SK's Toolbox の共通の設定（テーマ・テーマカラー・動きを減らす…）。設定の画面もここ -->
<script src="/toolbox/shared/settings.js" data-app="todo"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="page">
    <header class="app-bar">
      <a class="tb-back m3-state" href="/toolbox/" aria-label="SK's Toolbox に戻る"><span class="msr" aria-hidden="true">arrow_back</span><span>SK's Toolbox</span></a>
      <span class="app-bar__space"></span>
      <button type="button" class="icon-btn m3-state" data-install hidden aria-label="アプリとして追加" title="アプリとして追加"><span class="msr" aria-hidden="true">install_mobile</span></button>
      <button type="button" class="icon-btn m3-state" data-open-settings aria-label="Toolbox の設定" title="Toolbox の設定"><span class="msr" aria-hidden="true">settings</span></button>
      <div class="menu-wrap">
        <button type="button" class="icon-btn m3-state" id="btn-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="その他" title="その他"><span class="msr" aria-hidden="true">more_vert</span></button>
        <div class="menu" id="menu" role="menu" hidden>
          <button type="button" class="m3-state" role="menuitem" id="btn-clear-done"><span class="msr" aria-hidden="true">delete_sweep</span><span>完了したタスクを削除</span></button>
          <button type="button" class="m3-state" role="menuitem" id="btn-export"><span class="msr" aria-hidden="true">download</span><span>バックアップを書き出す</span></button>
          <button type="button" class="m3-state" role="menuitem" id="btn-import"><span class="msr" aria-hidden="true">upload</span><span>バックアップを読み込む</span></button>
        </div>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </header>

    <main class="main">
      <div class="head">
        <h1 class="head__title">Todo</h1>
        <p class="head__count" id="count" data-i18n-skip></p>
      </div>
      <div class="progress" role="progressbar" aria-label="進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><i id="progress-bar"></i></div>

      <!-- 追加する欄 -->
      <form class="add" id="add-form" autocomplete="off">
        <span class="msr add__icon" aria-hidden="true">add_task</span>
        <input type="text" id="add-text" class="add__input" placeholder="タスクを追加" aria-label="タスクを追加" maxlength="300" enterkeyhint="done">
        <button type="button" class="chip chip--date m3-state" id="add-due" hidden data-i18n-skip></button>
        <button type="button" class="icon-btn m3-state" id="btn-add-date" aria-label="期限を決める" title="期限を決める"><span class="msr" aria-hidden="true">event</span></button>
        <button type="submit" class="icon-btn add__submit m3-state" id="btn-add" aria-label="追加" title="追加" disabled><span class="msr" aria-hidden="true">arrow_upward</span></button>
      </form>

      <!-- 絞り込み（フィルターチップ） -->
      <div class="chips" role="group" aria-label="表示するタスク">
        <button type="button" class="chip m3-state" data-filter="all" aria-pressed="true"><span class="msr chip__check" aria-hidden="true">check</span><span>すべて</span></button>
        <button type="button" class="chip m3-state" data-filter="open" aria-pressed="false"><span class="msr chip__check" aria-hidden="true">check</span><span>未完了</span></button>
        <button type="button" class="chip m3-state" data-filter="done" aria-pressed="false"><span class="msr chip__check" aria-hidden="true">check</span><span>完了</span></button>
      </div>

      <ul class="tasks" id="tasks" data-i18n-skip></ul>

      <details class="done-section" id="done-section" open>
        <summary class="m3-state"><span class="msr" aria-hidden="true">expand_more</span><span id="done-title" data-i18n-skip></span></summary>
        <ul class="tasks" id="done-tasks" data-i18n-skip></ul>
      </details>

      <div class="empty" id="empty" hidden>
        <span class="msr" aria-hidden="true">task_alt</span>
        <p id="empty-text" data-i18n-skip></p>
      </div>

      <p class="note">タスクはこの端末のブラウザにだけ保存されます。</p>
    </main>
  </div>

  <!-- 期限を選ぶ（見えない日付の欄。showPicker() で開く） -->
  <input type="date" id="date-picker" class="date-picker" tabindex="-1" aria-hidden="true">

  <!-- スナックバー（「元に戻す」つき） -->
  <div class="snackbar" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" class="text-btn m3-state" id="toast-action" hidden>元に戻す</button></div>

  <script src="todo.js"></script>
  <script>window.SKI18N && SKI18N.translatePage();</script>
  <script src="/toolbox/shared/m3.js"></script>
  <script src="/toolbox/shared/pwa.js"></script>
</body>
