<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>saetab Bridge</title>
</head>
<body>

<h1>saetab Bridge 連携</h1>

<label>
  <input type="checkbox" id="enableToggle">
  親ページへのデータ共有を許可する（この画面 127.0.0.1:5500 に保存）
</label>

<div id="bridgeStatus" class="status">状態を確認中...</div>

<h2>今日の時間割</h2>
<pre id="timetableDisplay">読み込み中...</pre>

<h2>明日の時間割</h2>
<pre id="tomorrowDisplay">読み込み中...</pre>

<h2>メモデータ</h2>
<pre id="memoDisplay">読み込み中...</pre>

<script>
// ===== 設定 =====
const BRIDGE_KEY = 'saetab_bridge_enabled';
const REQUEST_TYPE = 'saetab_bridge_request';
const BRIDGE_TYPE = 'saetab_bridge_data';

// 応答を返してよい親ページのオリジン（末尾スラッシュなし）
const TARGET_ORIGINS = [
  'http://localhost:5501',
  'http://localhost:5500',
  'https://sy9-k.github.io',
  'https://sk-hub.jp',
  'https://search3958.github.io'
];

const TIMETABLE_KEY = 'sk_timetable';
const MEMO_KEY = 'sk_memo';
const MEMO_LIMIT = 10;
const REFRESH_MS = 60 * 1000;

const dateFmt = new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

// 親ページから届いたデータ（時間割・メモの中身のみ。許可のスイッチには使わない）
let parentStorage = null;
let lastRequestOrigin = '（まだ要求なし）';

const PARENT_KEY_MAP = {
  [TIMETABLE_KEY]: 'timetable',
  [MEMO_KEY]: 'memo'
};

// ===== ユーティリティ =====
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

// 自分（ブリッジ 127.0.0.1:5500）の localStorage
function ownGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function ownSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { console.warn('保存できません:', e); }
}

// 共有を許可しているか（ブリッジ自身の保存値だけで判断する）
function isEnabled() {
  return ownGet(BRIDGE_KEY) === 'true';
}

// データは、親から届いていればそれを使い、なければ自分の localStorage
function storageGet(key) {
  if (parentStorage && PARENT_KEY_MAP[key]) {
    const v = parentStorage[PARENT_KEY_MAP[key]];
    if (v !== undefined && v !== null) return v;
  }
  return ownGet(key);
}

function readJson(key) {
  try { return JSON.parse(storageGet(key) || 'null'); }
  catch (e) { console.warn('読み込みに失敗:', key, e); return null; }
}

// ===== 時間割：指定した日の分を取り出す =====
function getTimetableData(now = new Date()) {
  const store = readJson(TIMETABLE_KEY) || {};
  let tb = store.table || null;
  let title = (tb && tb.name) || '時間割';
  let source = '自分の時間割';
  if (store.view && store.view !== 'mine' && store.received && store.received[store.view]) {
    tb = store.received[store.view].table;
    title = store.received[store.view].title || title;
    source = '配信された時間割';
  }

  const result = { title, source, dateText: dateFmt.format(now), special: '', note: '', off: false, none: false, slots: [] };
  if (!tb) { result.none = true; return result; }

  const ds = ymd(now);
  const specials = (tb.special || []).filter(sp => sp && sp.from && sp.to && ds >= sp.from && ds <= sp.to);
  const sp = specials.length ? specials[specials.length - 1] : null;
  const day = sp ? ((sp.days || {})[ds] || { type: sp.kind === 'off' ? 'off' : 'normal' }) : null;
  if (sp) { result.special = sp.name || ''; result.note = (day && day.note) || ''; }

  if (day && day.type === 'off') { result.off = true; return result; }
  if (day && day.type === 'custom') {
    result.slots = (day.slots || [])
      .filter(x => x && x.subject)
      .map(x => ({ period: '', s: x.s || '', e: x.e || '', subject: x.subject, room: x.room || '' }))
      .sort((a, b) => a.s < b.s ? -1 : a.s > b.s ? 1 : 0)
      .map((x, i) => Object.assign(x, { period: String(i + 1) }));
    return result;
  }

  // いつもの時間割（月=0 … 土=5。日曜は授業なし）
  const di = (now.getDay() + 6) % 7;
  const days = tb.days === 6 ? 6 : 5;
  if (di >= days) { result.none = true; return result; }
  const periods = Math.min(10, Math.max(1, tb.periods || 6));
  const cells = tb.cells || {}, times = tb.times || [];
  for (let p = 0; p < periods; p++) {
    const c = cells[di + '-' + p];
    if (!c || !c.subject) continue;
    result.slots.push({
      period: String(p + 1),
      s: (times[p] && times[p].s) || '',
      e: (times[p] && times[p].e) || '',
      subject: c.subject,
      room: c.room || '',
      teacher: c.teacher || '',
      color: c.color || ''
    });
  }
  return result;
}

function getTomorrowData() {
  const now = new Date();
  return getTimetableData(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));
}

// ===== メモ：最新のタイトルを取り出す =====
function getMemoData() {
  const store = readJson(MEMO_KEY) || {};
  const notes = Array.isArray(store.notes) ? store.notes : [];
  const items = notes
    .filter(n => n && !n.deleted)
    .sort((a, b) => (b.updated || 0) - (a.updated || 0))
    .slice(0, MEMO_LIMIT)
    .map(n => {
      let title;
      if (n.locked) title = 'ロックされたメモ';
      else title = String(n.text || '').split('\n').map(s => s.trim()).find(Boolean) || '（無題）';
      return { id: n.id, title, updated: n.updated || n.created || 0, locked: !!n.locked, pinned: !!n.pinned };
    });
  return { lastUpdated: new Date().toISOString(), items };
}

function buildPayload() {
  return {
    timetable: getTimetableData(),
    tomorrow: getTomorrowData(),
    memo: getMemoData()
  };
}

// ===== 親ページへ送る（許可されているときだけ） =====
function sendToParent(data) {
  if (!window.parent || window.parent === window) return false;
  const message = { type: BRIDGE_TYPE, timestamp: Date.now(), data: data };
  for (const origin of TARGET_ORIGINS) {
    try { window.parent.postMessage(message, origin); }
    catch (e) { console.error('postMessage送信エラー:', origin, e); }
  }
  return true;
}

// ===== 親ページからの要求に答える =====
window.addEventListener('message', (e) => {
  if (!TARGET_ORIGINS.includes(e.origin)) {
    console.warn('許可されていないオリジンからの要求を無視:', e.origin);
    return;
  }
  if (!e.data || e.data.type !== REQUEST_TYPE) return;
  if (e.source !== window.parent) return;

  lastRequestOrigin = e.origin;
  if (e.data.storage) parentStorage = e.data.storage;
  refresh();
});

// ===== 画面表示 =====
function updateUI(enabled, timetable, tomorrow, memo) {
  const statusEl = document.getElementById('bridgeStatus');
  statusEl.className = enabled ? 'status enabled' : 'status disabled';
  statusEl.textContent = enabled
    ? `✅ 共有を許可中 — 要求元: ${lastRequestOrigin}`
    : `⚠️ 共有オフ — 上のチェックを入れると、親ページへ送ります（要求元: ${lastRequestOrigin}）`;

  document.getElementById('timetableDisplay').textContent = JSON.stringify(timetable, null, 2);
  document.getElementById('tomorrowDisplay').textContent = JSON.stringify(tomorrow, null, 2);
  document.getElementById('memoDisplay').textContent = JSON.stringify(memo, null, 2);
}

// ===== 更新（読み込み・表示・送信）=====
function refresh() {
  const enabled = isEnabled();
  document.getElementById('enableToggle').checked = enabled;
  const payload = buildPayload();
  updateUI(enabled, payload.timetable, payload.tomorrow, payload.memo);
  if (enabled) sendToParent(payload);
}

// ===== メイン処理 =====
document.getElementById('enableToggle').addEventListener('change', (e) => {
  ownSet(BRIDGE_KEY, e.target.checked ? 'true' : 'false');
  refresh();
});

document.addEventListener('DOMContentLoaded', () => {
  refresh();
  setInterval(refresh, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
});
</script>

</body>
</html>
