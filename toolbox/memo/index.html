<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="思いついたことを、すぐに書きとめるメモ帳。メモは、この端末に保存されます。">
<meta name="theme-color" content="#f8ece4" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memo">
<title>Memo | SK's Toolbox</title>
<!-- 多言語: /lang/ で選んだ言語で表示する（/assets/i18n.js。body の最後で translatePage()） -->
<script src="/assets/i18n.js"></script>
<!-- 文字は M PLUS 1、アイコンは Material Symbols（Google のマテリアルデザイン） -->
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@300;400;500;700&display=swap" data-icons="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></script>
<link rel="stylesheet" href="/toolbox/shared/m3.css">
<link rel="stylesheet" href="memo.css">
<!-- SK's Toolbox の共通の設定（テーマ・テーマカラー・動きを減らす…）。設定の画面もここ -->
<script src="/toolbox/shared/settings.js" data-app="memo"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="app" id="app">
    <!-- メモの一覧 -->
    <aside class="side" aria-label="メモの一覧">
      <header class="app-bar">
        <a class="tb-back m3-state" href="/toolbox/" aria-label="SK's Toolbox に戻る"><span class="msr" aria-hidden="true">arrow_back</span><span>SK's Toolbox</span></a>
        <span class="app-bar__space"></span>
        <button type="button" class="icon-btn m3-state" data-install hidden aria-label="アプリとして追加" title="アプリとして追加"><span class="msr" aria-hidden="true">install_mobile</span></button>
        <button type="button" class="icon-btn m3-state" data-open-settings aria-label="Toolbox の設定" title="Toolbox の設定"><span class="msr" aria-hidden="true">settings</span></button>
        <div class="menu-wrap">
          <button type="button" class="icon-btn m3-state" id="btn-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="その他" title="その他"><span class="msr" aria-hidden="true">more_vert</span></button>
          <div class="menu" id="menu" role="menu" hidden>
            <button type="button" class="m3-state" role="menuitem" id="btn-export"><span class="msr" aria-hidden="true">download</span><span>バックアップを書き出す</span></button>
            <button type="button" class="m3-state" role="menuitem" id="btn-import"><span class="msr" aria-hidden="true">upload</span><span>バックアップを読み込む</span></button>
          </div>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </header>

      <h1 class="side__title">Memo</h1>
      <label class="search">
        <span class="msr" aria-hidden="true">search</span>
        <input type="search" id="search" placeholder="メモを検索" aria-label="メモを検索" autocomplete="off">
      </label>

      <div class="list" id="list" data-i18n-skip></div>
      <div class="list__empty" id="list-empty" hidden>
        <span class="msr" aria-hidden="true">sticky_note_2</span>
        <p>メモはまだありません。<br>「新しいメモ」から書きはじめましょう。</p>
      </div>
      <div class="list__empty" id="search-empty" hidden>
        <span class="msr" aria-hidden="true">search_off</span>
        <p>見つかりませんでした。</p>
      </div>
      <p class="side__note">メモはこの端末のブラウザにだけ保存されます。大切なメモは、ときどきバックアップを書き出してください。</p>

      <button type="button" class="fab m3-state" id="btn-new" aria-label="新しいメモ"><span class="msr" aria-hidden="true">edit</span><span class="fab__label">新しいメモ</span></button>
    </aside>

    <!-- 書くところ -->
    <main class="editor" id="editor">
      <header class="app-bar editor__bar">
        <button type="button" class="icon-btn m3-state editor__back" id="btn-back" aria-label="メモの一覧に戻る"><span class="msr" aria-hidden="true">arrow_back</span></button>
        <span class="editor__status" id="status" aria-live="polite"></span>
        <span class="app-bar__space"></span>
        <button type="button" class="icon-btn m3-state" id="btn-pin" aria-pressed="false" aria-label="ピン留め" title="ピン留め"><span class="msr" aria-hidden="true">push_pin</span></button>
        <button type="button" class="icon-btn m3-state" id="btn-download" aria-label="テキストファイルで保存" title="テキストファイルで保存"><span class="msr" aria-hidden="true">file_save</span></button>
        <button type="button" class="icon-btn m3-state" id="btn-delete" aria-label="このメモを削除" title="このメモを削除"><span class="msr" aria-hidden="true">delete</span></button>
      </header>
      <textarea id="text" class="editor__text" placeholder="ここに書く（1 行目がタイトルになります）" aria-label="メモの本文" spellcheck="false"></textarea>
      <footer class="editor__foot" data-i18n-skip><span id="count"></span><span id="dates"></span></footer>
      <div class="editor__blank" id="blank">
        <img src="icon.svg" alt="" width="72" height="72">
        <p>メモを選ぶか、新しく書きはじめましょう。</p>
      </div>
    </main>
  </div>

  <!-- スナックバー（「元に戻す」つき） -->
  <div class="snackbar" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" class="text-btn m3-state" id="toast-action" hidden>元に戻す</button></div>

  <script src="memo.js"></script>
  <script>window.SKI18N && SKI18N.translatePage();</script>
  <script src="/toolbox/shared/m3.js"></script>
  <script src="/toolbox/shared/pwa.js"></script>
</body>
