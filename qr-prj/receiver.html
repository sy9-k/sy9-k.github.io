<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>QR Data Receiver</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }
    #video-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
    video { width: 100%; border-radius: 8px; background: #000; }
    progress { width: 100%; height: 20px; margin-top: 15px; }
    #status { font-weight: bold; margin: 10px 0; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
  </style>
  <!-- QR解析ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <h2>QR データ受信アプリ</h2>
  <div id="video-container">
    <video id="video" playsinline></video>
  </div>
  
  <progress id="progressBar" value="0" max="100"></progress>
  <div id="status">カメラの起動を待っています...</div>
  <button id="resetBtn">リセット・再読み取り</button>

  <!-- 画面外で画像処理をするための隠しCanvas -->
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const resetBtn = document.getElementById('resetBtn');

    let currentTransferId = null;
    let totalChunks = 0;
    let fileName = '';
    let receivedChunks = {};
    let isCompleted = false;

    // カメラ起動
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then((stream) => {
        video.srcObject = stream;
        video.setAttribute('playsinline', true);
        video.play();
        requestAnimationFrame(tick);
        status.textContent = 'QRコードをカメラにかざしてください';
      })
      .catch((err) => {
        status.textContent = 'カメラの起動に失敗しました: ' + err;
      });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && !isCompleted) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert',
        });

        if (code) {
          processQrData(code.data);
        }
      }
      requestAnimationFrame(tick);
    }

    function processQrData(dataString) {
      try {
        const payload = JSON.parse(dataString);
        
        // 必須プロパティのチェック
        if (!payload.id || payload.t === undefined || payload.i === undefined || !payload.d) return;

        // 新しい転送が始まった場合
        if (currentTransferId !== payload.id) {
          currentTransferId = payload.id;
          totalChunks = payload.t;
          fileName = payload.name || 'downloaded_file';
          receivedChunks = {};
          isCompleted = false;
        }

        // 未取得のチャンクなら保存
        if (!receivedChunks[payload.i]) {
          receivedChunks[payload.i] = payload.d;
          const count = Object.keys(receivedChunks).length;
          
          progressBar.max = totalChunks;
          progressBar.value = count;
          status.textContent = `受信中: ${count} / ${totalChunks} (${Math.round((count / totalChunks) * 100)}%)`;

          // 全チャンク取得完了チェック
          if (count === totalChunks) {
            isCompleted = true;
            status.textContent = '受信完了！ファイルを復元中...';
            assembleAndDownload();
          }
        }
      } catch (e) {
        // パース失敗（関係ないQRコードなど）は無視
      }
    }

    function assembleAndDownload() {
      // インデックス順に結合
      let fullBase64 = '';
      for (let i = 0; i < totalChunks; i++) {
        fullBase64 += receivedChunks[i];
      }

      // Base64からアンカータグを生成して自動ダウンロード
      const a = document.createElement('a');
      a.href = fullBase64;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      status.textContent = `ダウンロード完了: ${fileName}`;
    }

    resetBtn.addEventListener('click', () => {
      currentTransferId = null;
      totalChunks = 0;
      receivedChunks = {};
      isCompleted = false;
      progressBar.value = 0;
      status.textContent = 'リセットしました。QRコードをかざしてください';
    });
  </script>
</body>
</html>
