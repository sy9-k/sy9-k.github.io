<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>UI のくらべっこ</title>
<!--
  SK's Toolbox の設定画面を、iOS・Material 3・Fluent 2・One UI・HyperOS・デジタル庁デザインシステム・Toss・WeUI・shadcn/ui の 9 つのデザインと、SK オリジナルの「かさね」で再現した試作。配信しない（_ で始まるフォルダなので GitHub Pages には出ない）
  どれも「似せて作った」もので、各社・デジタル庁の本物の部品ではない。
  アイコンは Material 3 だけ Material Symbols（無料で使える）、ほかは自作の線のアイコン（SF Symbols・One UI のアイコンは Web では使えないため）
  動くところ: スイッチ・テーマ（ページ全体が切りかわる）・アプリの色・消去の確認ダイアログ・同期のお知らせ・スクロールで縮む見出し
  URL の #ios #md #fluent #oneui #hyper #dads #toss #weui #shad #kasane #all で開く画面を選べる。キーボードの 1〜9 と 0 で切りかえ、A でぜんぶ並べる
  ローカルで見る: python3 -m http.server 8765 → http://localhost:8765/_mockups/ui-compare/
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+1:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<script>(function(){try{var s=JSON.parse(localStorage.getItem("sk_ui_compare")||"{}"),t=s.theme;if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("dark");}})();</script>
<style>
  /* ===== ページ（試作の外側） ===== */
  :root {
    --p-bg: #e9ecf1; --p-ink: #14171c; --p-sub: #5b6270; --p-line: #d3d8e0; --p-card: #ffffff; --p-acc: #2563eb;
    color-scheme: light;
  }
  :root.dark { --p-bg: #0c0e12; --p-ink: #e8eaee; --p-sub: #9aa1ad; --p-line: #272b33; --p-card: #161920; --p-acc: #7aa2ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100dvh; background: var(--p-bg); color: var(--p-ink); font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }

  .top {
    position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 12px 16px; border-bottom: 1px solid var(--p-line);
    background: color-mix(in srgb, var(--p-bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .top__title { margin-right: auto; min-width: 0; }
  .top h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .top p { margin: 2px 0 0; font-size: 12px; color: var(--p-sub); }
  .pills { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--p-line); border-radius: 12px; background: var(--p-card); overflow-x: auto; max-width: 100%; }
  .pills button {
    flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--p-sub); white-space: nowrap;
  }
  .pills button:hover { color: var(--p-ink); }
  .pills button[aria-pressed="true"] { background: var(--p-ink); color: var(--p-bg); }
  .pills button:focus-visible { outline: 2px solid var(--p-acc); outline-offset: 1px; }
  .pills small { font-weight: 500; opacity: .7; margin-left: 4px; }

  .stage { display: flex; justify-content: center; align-items: flex-start; gap: 44px; padding: 28px 16px 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px 20px; max-width: 1640px; margin: 0 auto; padding: 24px 16px 48px; }
  .cell { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  .cap { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
  .cap span { font-size: 12px; color: var(--p-sub); }
  .grid .phone { width: 100%; max-width: 360px; height: 740px; }

  .notes { flex: 1; min-width: 0; max-width: 420px; position: sticky; top: 92px; font-size: 14px; line-height: 1.75; }
  .notes h2 { margin: 0; font-size: 26px; line-height: 1.3; }
  .notes .by { margin: 2px 0 16px; color: var(--p-sub); font-size: 13px; }
  .notes h3 { margin: 20px 0 6px; font-size: 13px; color: var(--p-sub); font-weight: 700; }
  .notes ul { margin: 0; padding-left: 1.2em; }
  .notes li + li { margin-top: 4px; }
  .notes p { margin: 0; }
  .web { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--p-line); border-radius: 12px; background: var(--p-card); }
  .web b { flex: none; font-size: 18px; line-height: 1.4; }
  .fit { padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--p-acc) 10%, var(--p-card)); }
  .disclaimer { margin-top: 20px !important; font-size: 12px; color: var(--p-sub); }

  @media (max-width: 860px) {
    .stage { flex-direction: column; align-items: center; gap: 28px; }
    .notes { position: static; max-width: 390px; width: 100%; }
  }

  /* ===== 電話（どのデザインにも共通の骨組み） ===== */
  .phone {
    position: relative; flex: none; width: 390px; max-width: 100%; height: min(820px, calc(100dvh - 120px)); min-height: 600px;
    border: 11px solid #0b0b0d; border-radius: 44px; overflow: hidden; isolation: isolate;
    box-shadow: 0 0 0 1.5px #3a3a40, 0 30px 60px -24px rgba(0, 0, 0, .4);
    background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  @media (max-width: 440px) {
    .stage .phone { border-width: 6px; border-radius: 34px; height: calc(100dvh - 150px); }
  }
  .phone button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
  .phone button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .phone h2, .phone h3, .phone p { margin: 0; }
  .i { width: 24px; height: 24px; flex: none; display: block; }
  .msr {
    font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
    letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; display: inline-block;
    font-feature-settings: "liga"; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; user-select: none; -webkit-user-select: none;
  }

  .sb { position: absolute; z-index: 20; top: 0; left: 0; right: 0; height: var(--sbh); display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 32px; font-size: 15px; font-weight: 600; pointer-events: none; color: var(--ink); }
  .sb-cam { position: absolute; left: 50%; top: 11px; width: 112px; height: 32px; margin-left: -56px; border-radius: 20px; background: #000; }
  .sb-icons { display: flex; align-items: center; gap: 5px; }
  .sb-icons svg { height: 11px; width: auto; fill: currentColor; }

  .scr { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 130px; }
  .scr::-webkit-scrollbar { display: none; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 4px; min-height: calc(var(--sbh) + 52px); padding: var(--sbh) 8px 0; transition: background .2s, box-shadow .2s; }
  .bar-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0; transition: opacity .2s; }
  .is-scrolled .bar-title { opacity: 1; }
  .ib { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 50%; }
  .hero-sub { display: none; }

  .acct { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .av { display: grid; place-items: center; flex: none; border-radius: 50%; font-weight: 600; }
  .acct-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .acct-actions { flex-basis: 100%; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }

  .list { position: relative; }
  .row { position: relative; display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; }
  .row-ic { display: grid; place-items: center; flex: none; }
  .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .row-sub, .row-sub-val, .grp-note { display: none; }
  .row-end { display: flex; align-items: center; gap: 6px; flex: none; }
  .row--stack { flex-wrap: wrap; }
  .row-body { flex-basis: 100%; min-width: 0; }
  .sw { position: relative; display: block; flex: none; }
  .sw-k { position: absolute; display: grid; place-items: center; }
  .sw-t { display: none; }
  .seg { display: flex; }
  .seg-ind, .nav-pill, .nav-search, .edgeb, .bar-brand, .ib-l, .ib-menu, .crumbs, .hero-lead, .hero-search, .capsule { display: none; }
  .seg-b { display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .seg-b .i, .seg-b .msr { display: none; }
  .sws { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .swt { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c) !important; color: #fff !important; transition: border-radius .3s, box-shadow .2s; }
  .swt .i, .swt .msr { width: 18px; height: 18px; font-size: 18px; stroke-width: 2.6; opacity: 0; transition: opacity .15s; }
  .swt[aria-checked="true"] .i, .swt[aria-checked="true"] .msr { opacity: 1; }
  .foot { margin: 28px 32px 0; font-size: 12px; line-height: 1.6; color: var(--sub); }

  .nav { position: absolute; z-index: 15; display: flex; }
  .nav-b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; text-align: center; }
  .nav-ind { display: grid; place-items: center; }
  .hb { position: absolute; z-index: 16; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); opacity: .85; pointer-events: none; }

  .toast { position: absolute; z-index: 30; display: flex; align-items: center; gap: 8px; opacity: 0; translate: 0 10px; pointer-events: none; transition: opacity .2s, translate .25s; }
  .toast.is-on { opacity: 1; translate: 0 0; }
  .toast-ic { display: none; }

  .dlg-wrap { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .32); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .dlg-wrap.is-on { opacity: 1; pointer-events: auto; }
  .dlg { transform: scale(.94); transition: transform .25s cubic-bezier(.2, 0, 0, 1); }
  .is-on > .dlg { transform: none; }
  .dlg-ic { display: none; }
  .dlg-acts { display: flex; }

  /* ===== iOS（Apple）。iOS 26 の Liquid Glass =====
     ガラス（.lg）: 薄い色＋ふちのハイライト（::after）＋内側の光。Chromium では JS が SVG のレンズ（ふちで背景が曲がる）を backdrop-filter に入れる。
     ほかのブラウザは、ふつうのすりガラス（blur）になる */
  .ios {
    --sbh: 50px; --bg: #f2f2f7; --surface: #ffffff; --ink: #000000; --sub: #8a8a8e; --line: #c6c6c8;
    --fill: rgba(120, 120, 128, .16); --accent: var(--sw); --danger: #ff3b30; --on: #34c759;
    --lg-tint: rgba(255, 255, 255, .16); --lg-shadow: 0 8px 28px rgba(0, 0, 0, .10), 0 1px 3px rgba(0, 0, 0, .06);
    --lg-spec: rgba(255, 255, 255, .95); --lg-spec2: rgba(255, 255, 255, .55); --lg-glow: rgba(255, 255, 255, .45); --lg-rim: rgba(255, 255, 255, .9);
    --pill: rgba(0, 0, 0, .07); --spring: cubic-bezier(.3, 1.35, .45, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    border-radius: 56px;
  }
  .dark .ios {
    --bg: #000000; --surface: #1c1c1e; --ink: #ffffff; --sub: #8d8d93; --line: #38383a; --fill: rgba(120, 120, 128, .32);
    --accent: color-mix(in srgb, var(--sw) 70%, #fff); --danger: #ff453a; --on: #30d158;
    --lg-tint: rgba(30, 30, 32, .26); --lg-shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .3);
    --lg-spec: rgba(255, 255, 255, .5); --lg-spec2: rgba(255, 255, 255, .22); --lg-glow: rgba(255, 255, 255, .07); --lg-rim: rgba(255, 255, 255, .45);
    --pill: rgba(255, 255, 255, .13);
  }
  .ios .lg {
    background: var(--lg-tint);
    backdrop-filter: blur(12px) saturate(1.8); -webkit-backdrop-filter: blur(12px) saturate(1.8);
    box-shadow: var(--lg-shadow), inset 1.5px 1.5px 1px -1px var(--lg-spec), inset -1px -1px 1px -.5px var(--lg-spec2), inset 0 0 16px var(--lg-glow);
  }
  .ios .lg::after {
    content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(135deg, var(--lg-rim), transparent 32%, transparent 68%, var(--lg-rim)) border-box;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity: .9;
  }
  /* 上と下のふち: バーの代わりに、スクロールした中身をぼかして薄くする（scroll edge effect） */
  .ios .bar { min-height: calc(var(--sbh) + 52px); padding: var(--sbh) 14px 4px; }
  .ios .bar::before {
    content: ""; position: absolute; inset: 0 0 -28px; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: linear-gradient(color-mix(in srgb, var(--bg) 82%, transparent) 30%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    -webkit-mask-image: linear-gradient(#000 45%, transparent); mask-image: linear-gradient(#000 45%, transparent);
  }
  .ios.is-scrolled .bar::before { opacity: 1; }
  .ios .bar [data-act="search"] { display: none; }
  .ios .edgeb {
    display: block; position: absolute; z-index: 14; left: 0; right: 0; bottom: 0; height: 130px; pointer-events: none;
    background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 40%, transparent));
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    -webkit-mask-image: linear-gradient(transparent, #000 65%); mask-image: linear-gradient(transparent, #000 65%);
  }
  .ios .ib { position: relative; transition: transform .45s var(--spring); }
  .ios .ib:active, .ios .nav-search:active { transform: scale(1.16); transition-duration: .2s; }
  .ios .ib .i { width: 22px; height: 22px; stroke-width: 2.2; }
  .ios .bar-title { text-align: center; font-size: 17px; font-weight: 600; }
  .ios .hero { padding: 4px 20px 6px; }
  .ios .hero-title { font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1.2; }
  .ios .acct { margin: 14px 16px 0; padding: 14px 16px; border-radius: 26px; background: var(--surface); }
  .ios .av { width: 60px; height: 60px; font-size: 24px; color: #fff; background: linear-gradient(#a8a8ad, #85858b); }
  .ios .acct-name { font-size: 20px; font-weight: 600; }
  .ios .acct-sub { font-size: 13px; color: var(--sub); }
  .ios .btn { height: 36px; padding: 0 16px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 15px; font-weight: 600; transition: transform .45s var(--spring); }
  .ios .btn:active { transform: scale(1.08); transition-duration: .2s; }
  .ios .btn .i { width: 18px; height: 18px; stroke-width: 2.2; }
  .ios .grp { margin: 28px 16px 0; }
  .ios .grp-title { margin: 0 16px 7px; font-size: 13px; font-weight: 400; color: var(--sub); }
  .ios .list { background: var(--surface); border-radius: 26px; overflow: hidden; }
  .ios .row { min-height: 52px; padding: 10px 16px; gap: 14px; }
  .ios .row + .row::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; height: .5px; background: var(--line); }
  .ios button.row:active { background: var(--fill); }
  .ios button.row[role="switch"]:active { background: none; }
  .ios .row-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--tile); color: #fff; }
  .ios .row-ic .i { width: 19px; height: 19px; stroke-width: 2.1; }
  .ios .row-label { font-size: 17px; }
  .ios .row-val { font-size: 17px; color: var(--sub); }
  .ios .row-chev { color: color-mix(in srgb, var(--sub) 70%, transparent); }
  .ios .row-chev .i { width: 15px; height: 15px; stroke-width: 2.8; }
  .ios .row--danger { justify-content: center; }
  .ios .row--danger .row-ic { display: none; }
  .ios .row--danger .row-text { align-items: center; }
  .ios .row--danger .row-label { color: var(--danger); }
  .ios .row--danger::before { left: 0 !important; }
  .ios .row-body { padding-left: 44px; }
  .ios .grp-note { display: block; margin: 7px 16px 0; font-size: 13px; line-height: 1.45; color: var(--sub); }
  /* スイッチ: 押しているあいだ、つまみがガラスのレンズになって大きくなる */
  .ios .sw { width: 64px; height: 28px; border-radius: 14px; background: var(--fill); transition: background .25s; }
  .ios .sw-k {
    top: 2px; left: 2px; width: 38px; height: 24px; border-radius: 12px; background: #fff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .06);
    transition: transform .5s var(--spring), background .2s, box-shadow .2s;
  }
  .ios [aria-checked="true"] .sw { background: var(--on); }
  .ios [aria-checked="true"] .sw-k { transform: translateX(22px); }
  .ios .row[role="switch"]:active .sw-k {
    transform: translateX(-2px) scale(1.4, 1.55); background: rgba(255, 255, 255, .16); transition-duration: .3s;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .16), inset 1px 1px 1px -.5px rgba(255, 255, 255, 1), inset -1px -1px 1px -.5px rgba(255, 255, 255, .7), inset 0 0 0 .6px rgba(255, 255, 255, .7), inset 0 0 8px rgba(255, 255, 255, .35);
  }
  .ios .row[role="switch"][aria-checked="true"]:active .sw-k { transform: translateX(24px) scale(1.4, 1.55); }
  /* 切りかえ: 選んだところの白い丸がばねのように動き、押しているあいだはガラスになる */
  .ios .seg { position: relative; margin-top: 10px; padding: 2px; border-radius: 999px; background: var(--fill); }
  .ios .seg-ind {
    display: block; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 3); border-radius: 999px;
    background: var(--surface); box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04);
    transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .55s var(--spring), scale .3s var(--spring), background .2s, box-shadow .2s;
  }
  .dark .ios .seg-ind { background: #636366; }
  .ios .seg:active .seg-ind {
    scale: 1.1 1.3; background: rgba(255, 255, 255, .14);
    box-shadow: 0 6px 16px rgba(0, 0, 0, .14), inset 1px 1px 1px -.5px rgba(255, 255, 255, 1), inset -1px -1px 1px -.5px rgba(255, 255, 255, .6), inset 0 0 0 .6px rgba(255, 255, 255, .7);
  }
  .ios .seg-b { position: relative; z-index: 1; flex: 1; height: 32px; border-radius: 999px; font-size: 14px; font-weight: 500; }
  .ios .seg-b[aria-checked="true"] { font-weight: 600; }
  .ios .swt { transition: box-shadow .2s, transform .45s var(--spring); }
  .ios .swt:active { transform: scale(1.15); }
  .ios .swt[aria-checked="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
  .ios .swt .i { display: none; }
  /* タブバー: 浮いたガラスのカプセル。選んだタブの丸（しずく）がばねで動き、動いているあいだはレンズになる。
     下へスクロールすると、選んでいるタブだけの丸に縮む（右の検索の丸はそのまま） */
  .ios .nav {
    left: 20px; right: 92px; bottom: 26px; height: 62px; padding: 4px; border-radius: 31px;
    transition: right .5s var(--spring), translate .3s;
  }
  .ios .lg.nav { --lg-tint: rgba(255, 255, 255, .2); }
  .dark .ios .lg.nav { --lg-tint: rgba(30, 30, 32, .34); }
  .ios.nav-min .nav { right: calc(100% - 20px - 62px); }

  .one .dlg-acts { margin-top: 14px; }
  .one .dbtn { position: relative; flex: 1; height: 54px; color: var(--accent); font-size: 16px; font-weight: 700; text-align: center; border-radius: 16px; }
  .one .dbtn:active { background: var(--fill); }
  .one .dbtn + .dbtn::before { content: ""; position: absolute; left: 0; top: 19px; bottom: 19px; width: 1px; background: var(--line); }
  .one .dbtn--danger { color: var(--danger); }

  /* ===== デジタル庁デザインシステム（日本） =====
     だれでも読めること・使えることがいちばん。文字は 16px 以上・行間 1.7、オン・オフはチェックボックス、選ぶものはラジオボタン、
     リンクは下線つきの文字、キーボードの位置は黒と黄色の太い枠。下のタブバーはなく、ヘッダー（検索・メニュー）とパンくずリストで場所を示す。
     ダークテーマはデザインシステムにないので、この試作で足したもの */
  .dads {
    --sbh: 40px; --font: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    --bg: #ffffff; --surface: #ffffff; --ink: #1a1a1c; --sub: #626264; --line: #d8d8db; --edge: #767678;
    --accent: color-mix(in srgb, var(--sw) 72%, #000); --accent-soft: color-mix(in srgb, var(--sw) 9%, #fff);
    --danger: #ec0000; --ok: #197a4b; --focus: #ffd43d;
    border-radius: 40px;
  }
  .dads[data-c="blue"] { --accent: #0017c1; --accent-soft: #e8f1fe; }
  .dark .dads {
    --bg: #1a1a1c; --surface: #1a1a1c; --ink: #f2f2f2; --sub: #b4b4b7; --line: #3d3d40; --edge: #9e9ea2;
    --accent: color-mix(in srgb, var(--sw) 45%, #fff); --accent-soft: color-mix(in srgb, var(--sw) 20%, #1a1a1c);
    --danger: #ff7b7b; --ok: #5fd39a;
  }
  .dark .dads[data-c="blue"] { --accent: #9db7f9; --accent-soft: #1b2557; }
  .dads button:focus-visible, .dads a:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 2px var(--focus); border-radius: 4px; }
  .dads .sb { padding: 0 24px; font-size: 14px; font-weight: 500; }
  .dads .sb-cam, .toss .sb-cam { top: 13px; width: 13px; height: 13px; margin-left: -6.5px; }
  .dads .bar { min-height: calc(var(--sbh) + 64px); padding: var(--sbh) 4px 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .dads [data-act="back"], .dads .bar-title { display: none; }
  .dads .bar-brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 18px; font-weight: 700; }
  .dads .bar-brand::before { content: ""; width: 26px; height: 26px; border-radius: 6px; background: var(--accent); flex: none; }
  .dads .ib { width: 56px; height: 56px; border-radius: 8px; flex-direction: column; gap: 0; display: flex; align-items: center; justify-content: center; }
  .dads .ib:hover { background: var(--accent-soft); }
  .dads .ib .i { width: 24px; height: 24px; stroke-width: 2; }
  .dads .ib-l { display: block; font-size: 11px; font-weight: 700; line-height: 1.3; }
  .dads .ib-menu { display: flex; }
  .dads .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 16px 16px 0; font-size: 14px; line-height: 1.7; color: var(--sub); }
  .dads .crumbs a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .dads .crumbs i { font-style: normal; }
  .dads .hero { padding: 16px 16px 8px; }
  .dads .hero-title { font-size: 32px; font-weight: 700; line-height: 1.5; letter-spacing: .02em; }
  .dads .hero-lead { display: block; margin-top: 8px; font-size: 16px; line-height: 1.7; color: var(--sub); }
  .dads .acct { margin: 16px 16px 0; padding: 24px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .dads .av { width: 48px; height: 48px; font-size: 20px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
  .dads .acct-name { font-size: 20px; font-weight: 700; line-height: 1.5; }
  .dads .acct-sub { font-size: 16px; line-height: 1.7; color: var(--sub); }
  .dads .btn { width: 100%; min-height: 56px; padding: 0 24px; gap: 8px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; }
  .dark .dads .btn { color: #1a1a1c; }
  .dads .btn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .dads .btn .i { width: 22px; height: 22px; stroke-width: 2.2; }
  .dads .grp { margin: 40px 16px 0; }
  .dads .grp-title { margin: 0 0 12px; font-size: 24px; font-weight: 700; line-height: 1.5; }
  .dads .list { border-top: 1px solid var(--line); }
  .dads .row { min-height: 64px; padding: 16px 0; gap: 14px; align-items: flex-start; border-bottom: 1px solid var(--line); }
  .dads .row-ic { display: none; }
  .dads .row-label { font-size: 16px; line-height: 1.7; }
  .dads .row-sub { display: block; font-size: 16px; line-height: 1.7; color: var(--sub); }
  .dads .row-end { order: -1; margin-top: 1px; }
  .dads button.row[data-act="link"] .row-end { order: 0; align-self: center; }
  .dads button.row[data-act="link"] .row-label { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .dads button.row[data-act="link"]:hover .row-label { text-decoration-thickness: 3px; }
  .dads .row-val { font-size: 16px; color: var(--sub); }
  .dads .row-chev { color: var(--accent); }
  .dads .row-chev .i { width: 20px; height: 20px; stroke-width: 2.4; }
  .dads .sw { width: 28px; height: 28px; border: 2px solid var(--edge); border-radius: 6px; background: var(--surface); }
  .dads .sw-k { inset: 0; }
  .dads [aria-checked="true"] .sw { background: var(--accent); border-color: var(--accent); }
  .dads [aria-checked="true"] .sw-k::after { content: ""; width: 12px; height: 7px; margin-top: -3px; border-left: 3px solid var(--surface); border-bottom: 3px solid var(--surface); transform: rotate(-45deg); }
  .dads .seg { flex-direction: column; gap: 4px; margin-top: 8px; }
  .dads .seg-b { justify-content: flex-start; gap: 12px; min-height: 44px; font-size: 16px; }
  .dads .seg-b::before { content: ""; flex: none; width: 28px; height: 28px; border: 2px solid var(--edge); border-radius: 50%; background: var(--surface); box-sizing: border-box; }
  .dads .seg-b[aria-checked="true"]::before { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 5px var(--surface); }
  .dads .row--stack .row-end { display: none; }
  .dads .sws { gap: 32px 24px; margin: 12px 0 24px; }
  .dads .swt { width: 44px; height: 44px; border-radius: 8px; }
  .dads .swt::after { content: attr(title); position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); font-size: 13px; line-height: 1.4; color: var(--ink); white-space: nowrap; }
  .dads .swt[aria-checked="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
  .dads .row--danger { justify-content: center; align-items: center; margin-top: 24px; min-height: 56px; border: 2px solid var(--danger); border-radius: 8px; color: var(--danger); }
  .dads .row--danger .row-text { flex: none; }
  .dads .row--danger .row-label { font-weight: 700; color: var(--danger); }
  .dads .row--danger:hover .row-label { text-decoration: underline; text-underline-offset: 3px; }
  .dads .foot { margin: 48px 0 0; padding: 24px 16px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.7; }
  .dads .nav { display: none; }
  .dads .scr { padding-bottom: 32px; }
  .dads .hb { width: 108px; height: 4px; margin-left: -54px; bottom: 7px; }
  .dads .toast { top: calc(var(--sbh) + 76px); left: 12px; right: 12px; gap: 12px; padding: 14px 16px; border: 2px solid var(--ok); border-radius: 12px; background: var(--surface); font-size: 16px; font-weight: 700; line-height: 1.6; box-shadow: 0 4px 12px rgba(0, 0, 0, .12); translate: 0 -8px; }
  .dads .toast.is-on { translate: 0 0; }
  .dads .toast-ic { display: block; color: var(--ok); }
  .dads .toast-ic .i { width: 24px; height: 24px; stroke-width: 2.6; }
  .dads .dlg-wrap { background: rgba(0, 0, 0, .5); padding: 16px; }
  .dads .dlg { width: 100%; padding: 32px 20px 20px; border-radius: 16px; background: var(--surface); }
  .dads .dlg-title { margin-bottom: 12px; font-size: 22px; font-weight: 700; line-height: 1.5; }
  .dads .dlg-msg { font-size: 16px; line-height: 1.7; }
  .dads .dlg-acts { flex-direction: column; gap: 12px; margin-top: 28px; }
  .dads .dbtn { min-height: 56px; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); font-size: 16px; font-weight: 700; text-align: center; }
  .dads .dbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .dads .dbtn--danger { order: -1; border-color: var(--danger); background: var(--danger); color: #fff; }
  .dark .dads .dbtn--danger { color: #1a1a1c; }

  /* ===== Toss（韓国の送金・金融アプリ） =====
     大きく太い見出しと話しかけるような文、灰色の背景に角の丸い白いカード（区切り線なし）、押すと少し縮む、確認は下から出るシート。
     フォントの Toss Product Sans は使えないので、Pretendard（無料・日本語版あり）。本物のアイコンは立体的な絵文字のようなもの */
  .toss {
    --sbh: 40px; --font: "Toss Product Sans", "Pretendard JP Variable", "Pretendard JP", -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --bg: #f2f4f6; --surface: #ffffff; --ink: #191f28; --sub: #6b7684; --sub2: #8b95a1; --line: #e5e8eb; --fill: #f2f4f6; --chev: #b0b8c1;
    --accent: var(--sw); --accent-weak: color-mix(in srgb, var(--sw) 11%, #fff); --danger: #f04452; --toast: rgba(51, 61, 75, .96);
    --press: cubic-bezier(.2, .9, .3, 1);
    border-radius: 40px;
  }
  .toss[data-c="blue"] { --accent: #3182f6; --accent-weak: #e8f3ff; }
  .dark .toss {
    --bg: #17171c; --surface: #202027; --ink: #ffffff; --sub: #9e9ea4; --sub2: #7e7e87; --line: #2c2c35; --fill: #2c2c35; --chev: #62626d;
    --accent: color-mix(in srgb, var(--sw) 75%, #fff); --accent-weak: color-mix(in srgb, var(--sw) 22%, #202027); --danger: #f66570; --toast: rgba(70, 70, 82, .96);
  }
  .dark .toss[data-c="blue"] { --accent: #4593fc; --accent-weak: #1d2c45; }
  .toss .sb { padding: 0 24px; font-size: 14px; font-weight: 600; }
  .toss .bar { min-height: calc(var(--sbh) + 54px); padding: var(--sbh) 8px 0; }
  .toss.is-scrolled .bar { background: var(--bg); }
  .toss [data-act="search"] { visibility: hidden; }
  .toss .ib { transition: transform .2s var(--press), background .15s; }
  .toss .ib:active { transform: scale(.9); background: var(--fill); }
  .toss .ib .i { width: 26px; height: 26px; stroke-width: 2.2; }
  .toss .bar-title { text-align: center; font-size: 17px; font-weight: 700; }
  .toss .hero { padding: 6px 24px 22px; }
  .toss .hero-title { font-size: 26px; font-weight: 700; line-height: 1.4; letter-spacing: -.01em; }
  .toss .hero-lead { display: block; margin-top: 6px; font-size: 17px; line-height: 1.5; color: var(--sub); }
  .toss .acct { margin: 0 12px; padding: 24px 20px 20px; border-radius: 24px; background: var(--surface); }
  .toss .av { width: 48px; height: 48px; font-size: 20px; font-weight: 700; background: var(--accent-weak); color: var(--accent); }
  .toss .acct-name { font-size: 20px; font-weight: 700; }
  .toss .acct-sub { font-size: 15px; color: var(--sub); }
  .toss .acct-actions { margin-top: 6px; }
  .toss .btn { width: 100%; height: 54px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; transition: transform .2s var(--press), filter .15s; }
  .toss .btn .i { display: none; }
  .toss .btn:active { transform: scale(.96); filter: brightness(.92); }
  .toss .grp { margin: 12px 12px 0; padding: 24px 0 10px; border-radius: 24px; background: var(--surface); }
  .toss .grp-title { margin: 0 24px 6px; font-size: 20px; font-weight: 700; }
  .toss .row { min-height: 64px; padding: 12px 24px; gap: 16px; border-radius: 16px; transition: transform .2s var(--press), background .15s; }
  .toss button.row:active { transform: scale(.98); background: var(--fill); }
  .toss .row-ic { width: 40px; height: 40px; border-radius: 50%; background: color-mix(in srgb, var(--tile) 14%, var(--surface)); color: var(--tile); }
  .toss .row-ic .i { width: 22px; height: 22px; stroke-width: 2.2; }
  .toss .row-label { font-size: 17px; font-weight: 500; line-height: 1.4; }
  .toss .row-sub { display: block; margin-top: 2px; font-size: 14px; line-height: 1.45; color: var(--sub2); }
  .toss .row-val { font-size: 15px; color: var(--sub); }
  .toss .row-chev { color: var(--chev); }
  .toss .row-chev .i { width: 18px; height: 18px; stroke-width: 2.6; }
  .toss .row--danger .row-label { color: var(--danger); }
  .toss .row--danger .row-ic { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); }
  .toss .row-body { padding-left: 56px; }
  .toss .sw { width: 50px; height: 30px; border-radius: 15px; background: var(--line); transition: background .25s; }
  .toss .sw-k { top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .15); transition: transform .3s var(--press); }
  .toss [aria-checked="true"] .sw { background: var(--accent); }
  .toss [aria-checked="true"] .sw-k { transform: translateX(20px); }
  .toss .seg { margin-top: 10px; padding: 4px; border-radius: 12px; background: var(--fill); }
  .toss .seg-b { flex: 1; height: 38px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--sub); transition: background .2s, color .2s, transform .2s var(--press); }
  .toss .seg-b:active { transform: scale(.95); }
  .toss .seg-b[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
  .dark .toss .seg-b[aria-checked="true"] { background: #3c3c47; }
  .toss .swt { width: 36px; height: 36px; transition: transform .2s var(--press); }
  .toss .swt:active { transform: scale(.88); }
  .toss .foot { margin: 24px 36px 0; color: var(--sub2); }
  .toss .nav { left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 8px 28px; background: var(--surface); border-top: 1px solid var(--line); }
  .toss .nav-b { gap: 3px; font-size: 10px; font-weight: 600; color: var(--chev); transition: transform .2s var(--press); }
  .toss .nav-b:active { transform: scale(.9); }
  .toss .nav-b .i { width: 26px; height: 26px; stroke-width: 2.2; }
  .toss .nav-b[aria-current="page"] { color: var(--ink); }
  .toss .hb { width: 108px; height: 4px; margin-left: -54px; bottom: 7px; }
  .toss .toast { left: 50%; bottom: 100px; max-width: calc(100% - 32px); gap: 10px; padding: 14px 20px; border-radius: 16px; transform: translateX(-50%); background: var(--toast); color: #fff; font-size: 15px; font-weight: 600; translate: 0 16px; transition: opacity .2s, translate .35s var(--press); }
  .toss .toast.is-on { translate: 0 0; }
  .toss .toast-ic { display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: #15c47e; color: #fff; }
  .toss .toast-ic .i { width: 14px; height: 14px; stroke-width: 3; }
  .toss .dlg-wrap { align-items: flex-end; background: rgba(0, 0, 0, .4); }
  .toss .dlg { position: relative; width: 100%; padding: 30px 24px 34px; border-radius: 28px 28px 0 0; background: var(--surface); transform: translateY(100%); transition: transform .4s var(--press); }
  .toss .dlg::before { content: ""; position: absolute; top: 10px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--line); }
  .toss .dlg-title { margin-bottom: 10px; font-size: 22px; font-weight: 700; line-height: 1.4; }
  .toss .dlg-msg { font-size: 16px; line-height: 1.55; color: var(--sub); }
  .toss .dlg-acts { gap: 8px; margin-top: 28px; }
  .toss .dbtn { flex: 1; height: 56px; border-radius: 16px; background: var(--fill); color: var(--sub); font-size: 17px; font-weight: 700; text-align: center; transition: transform .2s var(--press), filter .15s; }
  .toss .dbtn:active { transform: scale(.96); filter: brightness(.94); }
  .toss .dbtn--danger { background: var(--danger); color: #fff; }

  /* ===== HyperOS（Xiaomi） =====
     左寄せの大きな見出し＋その下の丸い検索欄、カードも区切り線もない白い背景に色つきの角丸アイコン、
     確認は画面の下に浮かぶカードで丸いボタンが左右に並ぶ。フォントの MiSans は使っていない */
  .hyper {
    --sbh: 40px; --font: "MiSans", "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
    --bg: #ffffff; --surface: #ffffff; --ink: #000000; --sub: #8c8c8c; --fill: #f0f0f0; --line: #ebebeb; --chev: #c2c2c2;
    --accent: var(--sw); --accent-soft: color-mix(in srgb, var(--sw) 12%, #fff); --danger: #e94634; --off: #e6e6e6;
    border-radius: 40px;
  }
  .hyper[data-c="blue"] { --accent: #0d84ff; --accent-soft: #e7f2ff; }
  .dark .hyper {
    --bg: #000000; --surface: #1a1a1a; --ink: #ffffff; --sub: #8c8c8c; --fill: #262626; --line: #262626; --chev: #5c5c5c;
    --accent: color-mix(in srgb, var(--sw) 72%, #fff); --accent-soft: color-mix(in srgb, var(--sw) 22%, #000); --danger: #ff6b5b; --off: #3a3a3a;
  }
  .dark .hyper[data-c="blue"] { --accent: #3482ff; --accent-soft: #0f2340; }
  .hyper .sb, .shad .sb { padding: 0 24px; font-size: 14px; font-weight: 600; }
  .hyper .sb-cam, .shad .sb-cam { top: 13px; width: 13px; height: 13px; margin-left: -6.5px; }
  .hyper .bar { min-height: calc(var(--sbh) + 52px); padding: var(--sbh) 8px 0; }
  .hyper.is-scrolled .bar { background: var(--bg); }
  .hyper .bar [data-act="search"] { visibility: hidden; }
  .hyper .bar-title { margin-left: 4px; font-size: 18px; font-weight: 600; }
  .hyper .ib .i { stroke-width: 2; }
  .hyper .ib:active { background: var(--fill); }
  .hyper .hero { padding: 0 24px 4px; }
  .hyper .hero-title { font-size: 34px; font-weight: 600; line-height: 1.3; }
  .hyper .hero-search { display: flex; align-items: center; gap: 8px; width: 100%; height: 44px; margin-top: 14px; padding: 0 16px; border-radius: 22px; background: var(--fill); color: var(--sub); font-size: 16px; }
  .hyper .hero-search .i { width: 20px; height: 20px; stroke-width: 2; }
  .hyper .acct { flex-wrap: nowrap; margin: 16px 8px 0; padding: 14px 16px; border-radius: 20px; }
  .hyper .av { width: 56px; height: 56px; font-size: 22px; font-weight: 600; background: linear-gradient(135deg, #ffb36b, #ff6a3d); color: #fff; }
  .hyper .acct-name { font-size: 18px; font-weight: 600; }
  .hyper .acct-sub { font-size: 13px; line-height: 1.45; color: var(--sub); }
  .hyper .acct-actions { flex-basis: auto; }
  .hyper .btn { height: 32px; padding: 0 14px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
  .hyper .btn .i { display: none; }
  .hyper .btn:active { filter: brightness(.94); }
  .hyper .grp { margin: 18px 0 0; }
  .hyper .grp-title { margin: 0 24px 4px; font-size: 13px; font-weight: 400; color: var(--sub); }
  .hyper .row { min-height: 64px; padding: 12px 24px; gap: 16px; transition: background .15s; }
  .hyper button.row:active { background: var(--fill); }
  .hyper .row-ic { width: 32px; height: 32px; border-radius: 10px; background: var(--tile); color: #fff; }
  .hyper .row-ic .i { width: 20px; height: 20px; stroke-width: 2.1; }
  .hyper .row-label { font-size: 16px; line-height: 1.4; }
  .hyper .row-sub { display: block; margin-top: 2px; font-size: 13px; line-height: 1.45; color: var(--sub); }
  .hyper .row-val { font-size: 14px; color: var(--sub); }
  .hyper .row-chev { color: var(--chev); }
  .hyper .row-chev .i { width: 16px; height: 16px; stroke-width: 2.4; }
  .hyper .row--danger .row-label { color: var(--danger); }
  .hyper .row-body { padding-left: 48px; }
  .hyper .sw { width: 50px; height: 28px; border-radius: 14px; background: var(--off); transition: background .25s; }

  .hyper .hb, .shad .hb { width: 108px; height: 4px; margin-left: -54px; bottom: 7px; }
  .hyper .toast { left: 50%; bottom: 104px; max-width: calc(100% - 48px); padding: 12px 22px; border-radius: 24px; transform: translateX(-50%); background: var(--surface); color: var(--ink); font-size: 14px; text-align: center; box-shadow: 0 6px 24px rgba(0, 0, 0, .14); }

  /* ===== shadcn/ui（Web） =====
     白と黒が基本、細い枠線ととても薄い影のカード、小さめの文字（14px）、フォントは Geist。スマホのタブバーはなく Web サイトのヘッダー。
     お知らせは下に出る小さなカード（Sonner）、確認は AlertDialog（スマホではボタンが縦に並ぶ）。
     「いつもの青」のときは shadcn/ui の基本の黒（neutral）、ほかの色ではその色を主役の色にする */
  .shad {
    --sbh: 40px; --font: "Geist", "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
    --bg: #ffffff; --surface: #ffffff; --ink: #0a0a0a; --sub: #737373; --muted: #f5f5f5; --line: #e5e5e5; --ring: #a1a1a1;
    --primary: var(--sw); --on-primary: #ffffff; --danger: #e7000b; --accent: var(--primary); --xs: 0 1px 2px rgba(0, 0, 0, .05);
    border-radius: 40px;
  }
  .shad[data-c="blue"] { --primary: #171717; --on-primary: #fafafa; }
  .dark .shad {
    --bg: #0a0a0a; --surface: #171717; --ink: #fafafa; --sub: #a1a1a1; --muted: #262626; --line: rgba(255, 255, 255, .1); --ring: #737373;
    --primary: color-mix(in srgb, var(--sw) 70%, #fff); --on-primary: #0a0a0a; --danger: #ff6467;
  }
  .dark .shad[data-c="blue"] { --primary: #e5e5e5; --on-primary: #171717; }
  .shad button:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent); }
  .shad .bar { min-height: calc(var(--sbh) + 56px); padding: var(--sbh) 12px 0 16px; gap: 8px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .shad [data-act="back"], .shad .bar-title { display: none; }
  .shad .bar-brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .shad .bar-brand::before { content: ""; flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--ink); }
  .shad .ib { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); box-shadow: var(--xs); transition: background .15s; }
  .shad .ib:hover { background: var(--muted); }
  .shad .ib-menu { display: grid; border-color: transparent; box-shadow: none; }
  .shad .ib .i { width: 16px; height: 16px; stroke-width: 2; }
  .shad .hero { padding: 28px 16px 4px; }
  .shad .hero-title { font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -.025em; }
  .shad .hero-lead { display: block; margin-top: 6px; font-size: 15px; line-height: 1.6; color: var(--sub); }
  .shad .acct { margin: 24px 16px 0; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--xs); }
  .shad .av { width: 40px; height: 40px; font-size: 15px; font-weight: 500; background: var(--muted); color: var(--ink); }
  .shad .acct-name { font-size: 15px; font-weight: 600; }
  .shad .acct-sub { font-size: 13px; color: var(--sub); }
  .shad .acct-actions { margin-top: 4px; }
  .shad .btn { height: 36px; padding: 0 16px; gap: 8px; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-size: 14px; font-weight: 500; box-shadow: var(--xs); transition: opacity .15s; }
  .shad .btn:hover { opacity: .9; }
  .shad .btn .i { width: 16px; height: 16px; stroke-width: 2; }
  .shad .grp { display: flex; flex-direction: column; margin: 16px 16px 0; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--xs); }
  .shad .grp-title { order: 0; font-size: 16px; font-weight: 600; line-height: 1.2; }
  .shad .grp-note { display: block; order: 1; margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--sub); }
  .shad .list { order: 2; display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .shad .row { padding: 12px; gap: 12px; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--xs); transition: background .15s; }
  .shad button.row:hover { background: var(--muted); }
  .shad .row-ic { display: none; }
  .shad .row-label { font-size: 14px; font-weight: 500; line-height: 1.4; }
  .shad .row-sub { display: block; margin-top: 2px; font-size: 13px; line-height: 1.45; color: var(--sub); }
  .shad .row-val { font-size: 13px; color: var(--sub); }
  .shad .row-chev { color: var(--sub); }
  .shad .row-chev .i { width: 16px; height: 16px; stroke-width: 2; }
  .shad .row--danger { justify-content: center; min-height: 36px; padding: 0 16px; border-color: transparent; background: var(--danger); }
  .shad .row--danger .row-text { flex: none; }
  .shad .row--danger .row-label { color: #fff; }
  .shad button.row--danger:hover { background: color-mix(in srgb, var(--danger) 90%, #000); }
  .shad .sw { width: 32px; height: 18px; border-radius: 9px; background: var(--line); box-shadow: var(--xs); transition: background .15s; }
  .dark .shad .sw { background: rgba(255, 255, 255, .15); }
  .shad .sw-k { top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); transition: transform .15s; }
  .shad [aria-checked="true"] .sw { background: var(--primary); }
  .shad [aria-checked="true"] .sw-k { transform: translateX(14px); }
  .dark .shad [aria-checked="true"] .sw-k { background: var(--on-primary); }
  .shad .seg { height: 36px; margin-top: 12px; padding: 3px; border-radius: 10px; background: var(--muted); }
  .shad .seg-b { flex: 1; border: 1px solid transparent; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--sub); transition: background .15s, color .15s; }
  .shad .seg-b[aria-checked="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
  .dark .shad .seg-b[aria-checked="true"] { background: rgba(255, 255, 255, .08); border-color: var(--line); }
  .shad .swt { width: 28px; height: 28px; }

  .shad .swt[aria-checked="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring); }
  .shad .foot { margin: 24px 16px 0; text-align: center; }
  .shad .nav { display: none; }
  .shad .scr { padding-bottom: 40px; }
  .shad .toast { left: 16px; right: 16px; bottom: 24px; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -4px rgba(0, 0, 0, .1); translate: 0 16px; transition: opacity .2s, translate .35s cubic-bezier(.2, .9, .3, 1); }
  .shad .toast.is-on { translate: 0 0; }
  .shad .toast-ic { display: block; }
  .shad .toast-ic .i { width: 16px; height: 16px; stroke-width: 2.4; }
  .shad .dlg-wrap { padding: 16px; background: rgba(0, 0, 0, .5); }
  .shad .dlg { width: 100%; padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: center; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1); transform: scale(.95); transition: transform .2s; }
  .shad .dlg-title { margin-bottom: 8px; font-size: 18px; font-weight: 600; line-height: 1.4; }
  .shad .dlg-msg { font-size: 14px; line-height: 1.6; color: var(--sub); }
  .shad .dlg-acts { flex-direction: column-reverse; gap: 8px; margin-top: 20px; }
  .shad .dbtn { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; font-weight: 500; text-align: center; box-shadow: var(--xs); transition: background .15s; }
  .shad .dbtn:hover { background: var(--muted); }
  .shad .dbtn--danger { border-color: transparent; background: var(--danger); color: #fff; }
  .shad .dbtn--danger:hover { background: color-mix(in srgb, var(--danger) 90%, #000); }

  /* ===== WeUI（WeChat のミニプログラム） =====
     WeChat の緑、右上のミニプログラムのカプセル（…・閉じる）、灰色の背景に端から端までの白いリスト（角丸カードなし）、
     選ぶものは右に緑のチェックが付く行、お知らせは画面の真ん中の黒い四角、アカウントの写真は角丸の四角。
     「いつもの青」のときは WeChat の緑、ほかの色ではその色 */
  .weui {
    --sbh: 40px; --font: -apple-system, "PingFang SC", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --bg: #ededed; --surface: #ffffff; --ink: rgba(0, 0, 0, .9); --sub: rgba(0, 0, 0, .55); --line: rgba(0, 0, 0, .1); --fill: #ececec; --chev: rgba(0, 0, 0, .3);
    --accent: var(--sw); --link: #576b95; --danger: #fa5151; --tab: #f7f7f7;
    border-radius: 40px;
  }
  .weui[data-c="blue"] { --accent: #07c160; }
  .dark .weui {
    --bg: #111111; --surface: #191919; --ink: rgba(255, 255, 255, .85); --sub: rgba(255, 255, 255, .5); --line: rgba(255, 255, 255, .08); --fill: #252525; --chev: rgba(255, 255, 255, .3);
    --accent: color-mix(in srgb, var(--sw) 80%, #fff); --link: #7d90a9; --danger: #fa5151; --tab: #191919;
  }
  .dark .weui[data-c="blue"] { --accent: #07c160; }
  .weui .sb { padding: 0 24px; font-size: 14px; font-weight: 600; }
  .weui .sb-cam { top: 13px; width: 13px; height: 13px; margin-left: -6.5px; }
  .weui .bar { min-height: calc(var(--sbh) + 48px); padding: var(--sbh) 8px 0; background: var(--bg); }
  .weui .bar-title { position: absolute; left: 100px; right: 100px; bottom: 0; height: 48px; line-height: 48px; opacity: 1; text-align: center; font-size: 17px; font-weight: 600; }
  .weui .bar > [data-act="search"] { display: none; }
  .weui .ib .i { stroke-width: 2; }
  .weui .capsule { display: flex; align-items: center; height: 32px; margin: 0 2px 0 auto; border: .5px solid rgba(0, 0, 0, .12); border-radius: 16px; background: rgba(255, 255, 255, .6); }
  .dark .weui .capsule { border-color: rgba(255, 255, 255, .15); background: rgba(0, 0, 0, .3); }
  .weui .capsule button { display: grid; place-items: center; width: 43px; height: 100%; }
  .weui .capsule .i { width: 20px; height: 20px; }
  .weui .capsule i { width: .5px; height: 18px; background: rgba(0, 0, 0, .15); }
  .dark .weui .capsule i { background: rgba(255, 255, 255, .2); }
  .weui .hero { display: none; }
  .weui .acct { flex-wrap: nowrap; gap: 16px; margin: 0; padding: 24px 16px; background: var(--surface); }
  .weui .av { width: 64px; height: 64px; border-radius: 8px; font-size: 26px; font-weight: 600; background: var(--accent); color: #fff; }
  .weui .acct-name { font-size: 20px; font-weight: 600; color: var(--ink); }
  .weui .acct-sub { font-size: 14px; line-height: 1.4; color: var(--sub); }
  .weui .acct-actions { flex-basis: auto; }
  .weui .btn { height: 32px; padding: 0 12px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; }
  .weui .btn .i { display: none; }
  .weui .btn:active { filter: brightness(.9); }
  .weui .grp-title { padding: 16px 16px 8px; font-size: 14px; font-weight: 400; color: var(--sub); }
  .weui .list { background: var(--surface); }
  .weui .row { min-height: 56px; padding: 16px; gap: 16px; }
  .weui .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--line); }
  .weui button.row:active { background: var(--fill); }
  .weui .row-ic { display: none; }
  .weui .row-label { font-size: 17px; line-height: 1.4; color: var(--ink); }
  .weui .row-val { font-size: 17px; color: var(--sub); }
  .weui .row-chev { color: var(--chev); }
  .weui .row-chev .i { width: 16px; height: 16px; stroke-width: 2; }
  .weui .row--danger { justify-content: center; }
  .weui .row--danger .row-text { align-items: center; }
  .weui .row--danger .row-label { color: var(--danger); }
  .weui .grp-note { display: block; padding: 8px 16px 0; font-size: 14px; line-height: 1.4; color: var(--sub); }
  .weui .row--stack { padding-bottom: 0; }
  .weui .seg { flex-direction: column; margin: 12px -16px 0 0; }
  .weui .seg-b { justify-content: space-between; min-height: 52px; padding-right: 16px; border-top: .5px solid var(--line); font-size: 17px; }
  .weui .seg-b:active { background: var(--fill); }
  .weui .seg-b .i { display: block; order: 2; width: 22px; height: 22px; stroke-width: 2.4; color: var(--accent); opacity: 0; }
  .weui .seg-b[aria-checked="true"] .i { opacity: 1; }
  .weui .sws { margin-bottom: 16px; }
  .weui .swt { width: 32px; height: 32px; border-radius: 6px; }
  .weui .sw { width: 52px; height: 32px; border-radius: 16px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); transition: background .3s; }
  .weui .sw-k { top: 1px; left: 1px; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); transition: transform .3s; }
  .weui [aria-checked="true"] .sw { background: var(--accent); box-shadow: none; }
  .weui [aria-checked="true"] .sw-k { transform: translateX(20px); }
  .weui .foot { margin: 32px 16px 0; text-align: center; font-size: 13px; color: var(--sub); }
  .weui .nav { left: 0; right: 0; bottom: 0; height: 84px; padding: 6px 0 28px; background: var(--tab); box-shadow: inset 0 .5px 0 var(--line); }
  .weui .nav-b { gap: 2px; font-size: 10px; color: var(--ink); }
  .weui .nav-b .i { width: 27px; height: 27px; stroke-width: 1.7; }
  .weui .nav-b[aria-current="page"] { color: var(--accent); }
  .weui .hb { width: 108px; height: 4px; margin-left: -54px; bottom: 7px; }
  .weui .toast {
    top: 50%; left: 50%; width: max-content; min-width: 136px; max-width: 200px; min-height: 136px; flex-direction: column; justify-content: center; gap: 8px;
    padding: 16px 14px; border-radius: 12px; transform: translate(-50%, -50%); background: rgba(76, 76, 76, .92); color: #fff;
    font-size: 14px; line-height: 1.4; text-align: center; translate: none; scale: .9; transition: opacity .15s, scale .15s;
  }
  .weui .toast.is-on { translate: none; scale: 1; }
  .weui .toast-ic { display: block; color: #fff; }
  .weui .toast-ic .i { width: 52px; height: 52px; stroke-width: 2; }
  .weui .dlg-wrap { background: rgba(0, 0, 0, .6); }
  .weui .dlg { width: calc(100% - 64px); max-width: 320px; overflow: hidden; border-radius: 12px; background: var(--surface); text-align: center; transform: scale(.95); }
  .dark .weui .dlg { background: #2c2c2c; }
  .weui .dlg-title { padding: 32px 24px 16px; font-size: 17px; font-weight: 700; line-height: 1.4; }
  .weui .dlg-msg { padding: 0 24px 32px; font-size: 15px; line-height: 1.5; color: var(--sub); }
  .weui .dlg-acts { border-top: .5px solid var(--line); }
  .weui .dbtn { flex: 1; height: 56px; font-size: 17px; font-weight: 700; color: var(--ink); text-align: center; }
  .weui .dbtn + .dbtn { border-left: .5px solid var(--line); }
  .weui .dbtn:active { background: var(--fill); }
  .weui .dbtn--danger { color: var(--danger); }

  /* ===== かさね（SK オリジナル） =====
     平安時代の「襲の色目」がもと。ぼかした影の代わりに、重ねた面のふちから裏の色がのぞく（一重・二重）。
     色は表（accent）と裏（ura）の 2 色の組み合わせ「色目」で、SK の 7 色に 1 つずつ。見出しは明朝（Shippori Mincho B1）、本文は Zen Kaku Gothic New。
     決まりの元はデザインシステム「かさね」、部品の見本は _mockups/kasane/ */
  .kas {
    --sbh: 44px; --font: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --bg: #eff0ec; --surface: #fbfbf9; --sunk: #e5e6e0; --line: #d5d6cf; --line-strong: #80827b; --ink: #1a1c20; --sub: #575a61;
    --accent: #2563eb; --ura: #e9a23b; --accent-text: color-mix(in oklab, var(--accent) 85%, #000);
    --accent-soft: color-mix(in oklab, var(--accent) 12%, var(--surface));
    --danger: #b42318; --danger-text: #b42318; --ura-danger: #f1a399; --scrim: rgba(17, 19, 23, .48);
    --l1: 3px; --l2: 6px; --ease: cubic-bezier(.3, .7, .2, 1);
    border-radius: 40px;
  }
  .kas[data-c="blue"] { --accent-text: #1d4ed8; }
  .kas[data-c="sakura"] { --accent: #be185d; --ura: #f4a3c0; }
  .kas[data-c="matcha"] { --accent: #15803d; --ura: #6d28d9; }
  .kas[data-c="mikan"] { --accent: #c2410c; --ura: #8a1c1c; }
  .kas[data-c="fuji"] { --accent: #7c3aed; --ura: #8fbf3a; }
  .kas[data-c="sora"] { --accent: #0e7490; --ura: #9fd8e4; }
  .kas[data-c="sumi"] { --accent: #334155; --ura: #d9481e; }
  .dark .kas {
    --bg: #111317; --surface: #1b1e24; --sunk: #0c0d10; --line: #30343c; --line-strong: #6c727e; --ink: #ecece6; --sub: #a5a9b1;
    --accent-text: color-mix(in oklab, var(--accent) 45%, #fff); --danger-text: #ff8f80; --ura-danger: #6e1a12; --scrim: rgba(0, 0, 0, .6);
  }
  .dark .kas[data-c="blue"] { --accent-text: #8db0ff; }
  .dark .kas[data-c="matcha"] { --ura: #a78bfa; }
  .dark .kas[data-c="mikan"] { --ura: #f87171; }
  .dark .kas[data-c="sumi"] { --accent: #475569; }
  .kas button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  .kas .sb { padding: 0 26px 0 30px; font-size: 15px; font-weight: 700; }
  .kas .bar { min-height: calc(var(--sbh) + 52px); padding: var(--sbh) 8px 0; }
  .kas.is-scrolled .bar { background: var(--bg); box-shadow: inset 0 -1px 0 var(--line); }

  var LENS_OPTS = { nav: { bezel: 22, blur: .6, power: 2.2 }, "nav-search": { bezel: 22, blur: .6, power: 2.2 }, ib: { bezel: 15, blur: .6, power: 2.2 }, toast: { bezel: 14, blur: 4 }, dlg: { bezel: 22, blur: 8 } };
  function lensOf(el) {
    for (var k in LENS_OPTS) if (el.classList.contains(k)) return LENS_OPTS[k];
    return {};
  }
  var lensRO = window.ResizeObserver ? new ResizeObserver(function (entries) {
    entries.forEach(function (en) {
      var el = en.target;
      lens(el, lensOf(el));
      if (el.classList.contains("nav")) placePill(el, true);
    });
  }) : null;
  // instant: タブバーが縮む・広がるあいだは、しずくをばねで動かさずにタブにぴったり付ける
  function placePill(nav, instant) {
    var cur = $(".nav-b[aria-current]", nav), pill = $(".nav-pill", nav);
    if (!cur || !pill) return;
    if (instant) pill.style.transition = "none";
    pill.style.left = cur.offsetLeft + "px";
    pill.style.width = cur.offsetWidth + "px";
    if (instant) { pill.offsetWidth; pill.style.transition = ""; }
  }
  // タブを変えたとき: しずくが伸びながら移り、動いているあいだはレンズ（下のアイコンが大きく見える）
  function movePill(ph) {
    var nav = $(".nav", ph), pill = $(".nav-pill", nav);
    placePill(nav);
    pill.classList.add("is-moving");
    pill._lensKey = null;
    lens(pill, { bezel: 14, blur: 0, power: 2.2, sat: 1.3 });
    clearTimeout(pill._t);
    pill._t = setTimeout(function () {
      pill.classList.remove("is-moving");
      pill.style.backdropFilter = pill.style.webkitBackdropFilter = "";
    }, 520);
  }

  function bind(ph) {
    var scr = $(".scr", ph), hero = $(".hero", ph), bar = $(".bar", ph), isIOS = ph.classList.contains("ios"), lastY = 0;
    function onScroll() {
      var y = scr.scrollTop, th = Math.max(8, hero.offsetTop + hero.offsetHeight - bar.offsetHeight - 24);
      ph.classList.toggle("is-scrolled", y > th);
      // iOS 26: 下へスクロールするとタブバーが縮み、上へ戻すと広がる
      if (isIOS) {
        if (y > lastY + 6 && y > 80) { ph.classList.add("nav-min"); lastY = y; }
        else if (y < lastY - 6 || y <= 80) { ph.classList.remove("nav-min"); lastY = y; }
      }
    }
    scr.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    if (isIOS) {
      placePill($(".nav", ph), true);
      $(".nav", ph).addEventListener("transitionend", function (e) {
        if (e.target.classList.contains("nav-b") && e.propertyName === "flex-grow") placePill(this, true);
      });
      $$(".lg", ph).forEach(function (el) { lens(el, lensOf(el)); if (lensRO) lensRO.observe(el); });
      $(".nav", ph).addEventListener("click", function (e) {
        // 縮んでいるタブバーを押したら広げる
        if (ph.classList.contains("nav-min")) { ph.classList.remove("nav-min"); lastY = scr.scrollTop; e.stopPropagation(); }
      }, true);
    }
    scr.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    ph.addEventListener("click", function (e) {
      var t = e.target.closest("button, [data-act]");
      if (!t || !ph.contains(t)) return;
      if (t.tagName === "A") e.preventDefault();
      if (t.dataset.sw) { setSwitch(t.dataset.sw, t.getAttribute("aria-checked") !== "true"); return; }
      if (t.dataset.themeSet) { setTheme(t.dataset.themeSet); return; }
      if (t.dataset.color) { setColor(t.dataset.color); return; }
      if (t.dataset.tab) {
        if (t.hasAttribute("aria-current")) return;
        $$(".nav-b", ph).forEach(function (b) { if (b === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
        if (isIOS) movePill(ph);
        if (t.dataset.tab !== "settings") toast(ph, "試作なので、設定の画面だけです");
        return;
      }
      switch (t.dataset.act) {
        case "sync": toast(ph, "同期しました"); break;
        case "link": toast(ph, "「" + t.dataset.label + "」は試作なので開きません"); break;
        case "back": case "search": case "menu": toast(ph, "試作なので、この画面だけです"); break;
        case "danger": openDlg(ph); break;
        case "cancel": closeDlg(ph); break;
        case "confirm": closeDlg(ph); toast(ph, "消去しました（試作なので、実際には消えていません）"); break;
        case "scrim": if (e.target === t) closeDlg(ph); break;
      }
    });
  }

  // ---- どの電話にも同じように効く設定 ----
  var mq = matchMedia("(prefers-color-scheme: dark)");
  function applyTheme() {
    var dark = state.theme === "dark" || (state.theme === "auto" && mq.matches);
    document.documentElement.classList.toggle("dark", dark);
    $$("[data-theme-set]").forEach(function (b) { b.setAttribute("aria-checked", b.dataset.themeSet === state.theme); });
    $$(".seg").forEach(function (s) { s.style.setProperty("--i", themeIndex()); });
    $$("#theme-pills button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.theme === state.theme); });
  }
  if (mq.addEventListener) mq.addEventListener("change", applyTheme);
  function setTheme(t) { state.theme = t; save(); applyTheme(); }
  function setColor(c) {
    state.color = c; save();
    var hex = swHex();
    $$(".phone").forEach(function (ph) { ph.style.setProperty("--sw", hex); ph.setAttribute("data-c", c); });
    $$("[data-color]").forEach(function (b) { b.setAttribute("aria-checked", b.dataset.color === c); });
  }
  function setSwitch(id, v) {
    state.sw[id] = v; save();
    $$('[data-sw="' + id + '"]').forEach(function (b) { b.setAttribute("aria-checked", v); });
  }

  // ---- ページ ----
  $("#ui-pills").innerHTML = UIS.map(function (u, i) {
    return '<button type="button" data-ui-set="' + u.key + '" title="キー ' + ((i + 1) % 10) + '">' + u.name + "<small>" + u.by + "</small></button>";
  }).join("") + '<button type="button" data-all title="キー A">ぜんぶ並べる</button>';
  $("#theme-pills").innerHTML = THEMES.map(function (t) { return '<button type="button" data-theme="' + t.key + '">' + t.name + "</button>"; }).join("");

  function render() {
    var main = $("#main");
    if (lensRO) lensRO.disconnect();
    if (lensDefs) lensDefs.innerHTML = "";
    if (state.all) {
      main.className = "grid";
      main.innerHTML = UIS.map(function (u) {
        return '<figure class="cell"><figcaption class="cap"><b>' + u.name + "</b><span>" + u.by + "</span></figcaption>" + phoneHTML(u) + "</figure>";
      }).join("");
    } else {
      var u = UIS.filter(function (x) { return x.key === state.ui; })[0] || UIS[1];
      main.className = "stage";
      main.innerHTML = phoneHTML(u) + notesHTML(u);
    }
    $$(".phone", main).forEach(bind);
    $$("#ui-pills [data-ui-set]").forEach(function (b) { b.setAttribute("aria-pressed", !state.all && b.dataset.uiSet === state.ui); });
    $("#ui-pills [data-all]").setAttribute("aria-pressed", state.all);
    try { history.replaceState(null, "", "#" + (state.all ? "all" : state.ui)); } catch (e) {}
    save();
    applyTheme();
  }

  $("#ui-pills").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-all")) state.all = !state.all;
    else { state.ui = b.dataset.uiSet; state.all = false; }
    render();
  });
  $("#theme-pills").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) setTheme(b.dataset.theme);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { $$(".phone").forEach(closeDlg); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
    var n = e.key === "0" ? 10 : parseInt(e.key, 10);
    if (n >= 1 && n <= UIS.length) { state.ui = UIS[n - 1].key; state.all = false; render(); }
    else if (e.key === "a" || e.key === "A") { state.all = !state.all; render(); }
  });

  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (h === "all") state.all = true;
    else if (UIS.some(function (u) { return u.key === h; })) { state.ui = h; state.all = false; }
    else return;
    render();
  });

  render();
})();
</script>
</body>
</html>
