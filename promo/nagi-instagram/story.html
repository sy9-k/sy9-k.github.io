<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Nagi Story</title>
<!-- Nagi のインスタストーリー用の広告（1080×1920 の 1 枚絵）
     PNG にするとき: このフォルダで sh render.sh -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,500,1,0&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "M PLUS 1", "Hiragino Sans", sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(180deg, #17b3a1 0%, #0f7a72 38%, #0c4d5c 74%, #0b2c48 100%);
  }
  .msr { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; white-space: nowrap; font-feature-settings: "liga"; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }

  /* 上（インスタの名前の帯の下から） */
  #brand { position: absolute; left: 90px; top: 182px; display: flex; align-items: center; gap: 24px; }
  /* アイコンの後ろの白い板 */
  #brand .tile { flex: none; width: 120px; height: 120px; border-radius: 34px; background: #fff; display: grid; place-items: center; box-shadow: 0 18px 44px -14px rgba(0,0,0,.45); }
  #brand .tile img { width: 84px; height: 84px; border-radius: 22px; }
  #brand b { display: block; font-size: 56px; font-weight: 800; line-height: 1; }
  #brand span { display: block; margin-top: 10px; font-size: 32px; font-weight: 500; opacity: .85; }

  #head { position: absolute; left: 90px; top: 320px; font-size: 100px; font-weight: 800; line-height: 1.22; letter-spacing: -.01em; }
  #head em { font-style: normal; color: #9ef2e4; }

  /* 真ん中: アプリの画面 */
  #card {
    position: absolute; left: 140px; top: 700px; width: 800px; height: 590px; border-radius: 64px;
    background: #f4fbf8; color: #161d1b; box-shadow: 0 50px 110px -30px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center;
  }
  #chip { margin-top: 40px; display: inline-flex; align-items: center; gap: 10px; padding: 12px 30px; border-radius: 999px; background: #9ef2e4; color: #00201c; font-size: 32px; font-weight: 700; }
  #chip .msr { font-size: 36px; }
  #ring { position: relative; width: 290px; height: 290px; margin-top: 24px; }
  #ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #ring circle { fill: none; stroke-width: 16; }
  #ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 68px; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  #play { margin-top: 26px; display: inline-flex; align-items: center; gap: 10px; padding: 18px 44px; border-radius: 999px; background: #006a60; color: #fff; font-size: 34px; font-weight: 700; }
  #play .msr { font-size: 42px; }

  /* 今日の集中（カードの右下にかさねる） */
  #today {
    position: absolute; left: 690px; top: 1225px; width: 330px; padding: 30px 28px; box-sizing: border-box; border-radius: 40px;
    background: #fff; color: #161d1b; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
  }
  #today small { display: block; white-space: nowrap; font-size: 24px; font-weight: 500; color: #3f4946; }
  #today strong { display: block; margin-top: 4px; font-size: 46px; font-weight: 800; white-space: nowrap; }
  #bar { margin-top: 14px; height: 14px; border-radius: 7px; background: #cce8e2; overflow: hidden; }
  #bar div { width: 75%; height: 100%; border-radius: 7px; background: #006a60; }
  #streak { margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 700; color: #006a60; }
  #streak .msr { font-size: 34px; }

  /* 特徴 */
  #feats { position: absolute; left: 90px; top: 1335px; display: flex; flex-direction: column; gap: 16px; }
  .feat { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 700; }
  .feat .msr { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; font-size: 38px; background: rgba(255,255,255,.16); }

  /* 下: 案内（下の 250px はインスタの返信欄に空ける） */
  #cta { position: absolute; left: 0; width: 1080px; top: 1600px; text-align: center; }
  #sub { position: absolute; left: 90px; top: 600px; font-size: 40px; font-weight: 700; color: #9ef2e4; }
  #url { display: inline-flex; align-items: center; gap: 16px; padding: 28px 56px; border-radius: 999px; background: #fff; color: #0b3b45; font-size: 50px; font-weight: 800; box-shadow: 0 30px 70px -20px rgba(0,0,0,.55); }
  #url .msr { font-size: 56px; }

  #waves { position: absolute; left: 0; bottom: 0; width: 1080px; height: 300px; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" style="left:-200px; top:-160px; width:760px; height:760px; background:#5eead4; opacity:.45"></div>
  <div class="glow" style="right:-260px; top:820px; width:700px; height:700px; background:#22c3e6; opacity:.22"></div>

  <svg id="waves" viewBox="0 0 1080 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 C 180 80, 360 160, 540 120 S 900 80, 1080 120 L1080 300 L0 300 Z" fill="rgba(255,255,255,.05)"/>
    <path d="M0 190 C 200 150, 380 230, 560 190 S 920 150, 1080 190 L1080 300 L0 300 Z" fill="rgba(255,255,255,.06)"/>
  </svg>

  <div id="brand">
    <div class="tile"><img src="../../nagi/ico/icon-512.png" alt=""></div>
    <div><b>Nagi</b><span>集中タイマー</span></div>
  </div>

  <div id="head">集中と休憩を、<br><em>ここちよく。</em></div>
  <div id="sub">無料・登録なしで、今すぐ使える</div>

  <div id="card">
    <div id="chip"><span class="msr">self_improvement</span>集中</div>
    <div id="ring">
      <svg viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="108" stroke="#cce8e2"/>
        <circle cx="120" cy="120" r="108" stroke="#006a60" stroke-linecap="round" stroke-dasharray="678.58" stroke-dashoffset="170"/>
      </svg>
      <b>18:42</b>
    </div>
    <div id="play"><span class="msr">pause</span>一時停止</div>
  </div>

  <div id="today">
    <small>今日の集中・目標 2時間</small>
    <strong>1時間30分</strong>
    <div id="bar"><div></div></div>
    <div id="streak"><span class="msr">waves</span>12日連続</div>
  </div>

  <div id="feats">
    <div class="feat"><span class="msr">timer</span>25分集中 → 5分休憩</div>
    <div class="feat"><span class="msr">flag</span>目標と連続日数で続く</div>
    <div class="feat"><span class="msr">install_mobile</span>アプリのように使える</div>
  </div>

  <div id="cta">
    <div id="url"><span class="msr">open_in_new</span>sy9-k.github.io/nagi</div>
  </div>
</div>
</body>
</html>
