<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MALU Story</title>
<!-- MALU のインスタストーリー用の広告（1080×1920 の 1 枚絵）。Nagi の広告（promo/nagi-instagram）と同じ組み方
     PNG にするとき: このフォルダで sh render.sh -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,500,1,0&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "M PLUS 1", "Hiragino Sans", sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(180deg, #4d86e6 0%, #2a62c4 38%, #183f8c 74%, #0d2257 100%);
  }
  .msr { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; white-space: nowrap; font-feature-settings: "liga"; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }

  /* 上（インスタの名前の帯の下から） */
  #brand { position: absolute; left: 90px; top: 182px; display: flex; align-items: center; gap: 24px; }
  /* アイコンの後ろの白い板 */
  #brand .tile { flex: none; width: 120px; height: 120px; border-radius: 34px; background: #fff; display: grid; place-items: center; box-shadow: 0 18px 44px -14px rgba(0,0,0,.45); }
  /* アイコンの画像は周りが白い余白なので、青い本体だけが 96px になるように大きくして切り抜く */
  #brand .ic { position: relative; width: 70px; height: 82px; border-radius: 22px; overflow: hidden; }
  #brand .ic img { position: absolute; width: 134px; height: 134px; left: -32px; top: -26px; }
  #brand b { display: block; font-size: 56px; font-weight: 800; line-height: 1; }
  #brand span { display: block; margin-top: 10px; font-size: 32px; font-weight: 500; opacity: .85; }

  #head { position: absolute; left: 90px; top: 320px; font-size: 100px; font-weight: 800; line-height: 1.22; letter-spacing: -.01em; }
  #head em { font-style: normal; color: #b3c5ff; }
  #sub { position: absolute; left: 90px; top: 600px; font-size: 40px; font-weight: 700; color: #b3c5ff; }

  /* 真ん中: アプリの画面 */
  #card {
    position: absolute; left: 140px; top: 700px; width: 800px; height: 530px; border-radius: 64px;
    background: #f8f9ff; color: #1a1b21; box-shadow: 0 50px 110px -30px rgba(0,0,0,.55);
    padding: 48px 50px 0; box-sizing: border-box;
  }
  #search { display: flex; align-items: center; gap: 18px; height: 104px; padding: 0 34px; border-radius: 52px; background: #fff; border: 3px solid #365da2; box-sizing: border-box; }
  #search .msr { font-size: 48px; color: #365da2; }
  #search b { font-size: 44px; font-weight: 700; }
  #search i { display: inline-block; width: 4px; height: 50px; margin-left: -12px; background: #365da2; border-radius: 2px; }
  #cats { margin-top: 30px; display: flex; gap: 14px; }
  .cat { padding: 12px 26px; border-radius: 999px; border: 2px solid #c2c6d7; font-size: 30px; font-weight: 700; color: #434654; }
  .cat.on { background: #dae2ff; border-color: #dae2ff; color: #001b3d; }
  #dicts { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .dict { display: flex; align-items: center; justify-content: space-between; height: 86px; padding: 0 28px; border-radius: 28px; background: #ecedf5; font-size: 34px; font-weight: 700; color: #1a1b21; }
  .dict .msr { font-size: 36px; color: #365da2; }
  .dict.on { background: #365da2; color: #fff; }
  .dict.on .msr { color: #fff; }

  /* 引ける辞書（カードの右下にかさねる） */
  #count {
    position: absolute; left: 690px; top: 1170px; width: 330px; padding: 30px 28px; box-sizing: border-box; border-radius: 40px;
    background: #fff; color: #1a1b21; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
  }
  #count small { display: block; white-space: nowrap; font-size: 24px; font-weight: 500; color: #434654; }
  #count strong { display: block; margin-top: 4px; font-size: 46px; font-weight: 800; white-space: nowrap; }
  #count strong i { font-style: normal; font-size: 30px; font-weight: 700; margin-left: 4px; }
  #count p { margin: 14px 0 0; display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 700; color: #365da2; }
  #count p .msr { font-size: 34px; }

  /* 特徴 */
  #feats { position: absolute; left: 90px; top: 1335px; display: flex; flex-direction: column; gap: 16px; }
  .feat { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 700; }
  .feat .msr { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; font-size: 38px; background: rgba(255,255,255,.16); }

  /* 下: 案内（下の 250px はインスタの返信欄に空ける） */
  #cta { position: absolute; left: 0; width: 1080px; top: 1600px; text-align: center; }
  #url { display: inline-flex; align-items: center; gap: 16px; padding: 28px 56px; border-radius: 999px; background: #fff; color: #0d2257; font-size: 50px; font-weight: 800; box-shadow: 0 30px 70px -20px rgba(0,0,0,.55); }
  #url .msr { font-size: 56px; }

  #waves { position: absolute; left: 0; bottom: 0; width: 1080px; height: 300px; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" style="left:-200px; top:-160px; width:760px; height:760px; background:#8fb2ff; opacity:.45"></div>
  <div class="glow" style="right:-260px; top:820px; width:700px; height:700px; background:#6c8cff; opacity:.22"></div>

  <svg id="waves" viewBox="0 0 1080 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 C 180 80, 360 160, 540 120 S 900 80, 1080 120 L1080 300 L0 300 Z" fill="rgba(255,255,255,.05)"/>
    <path d="M0 190 C 200 150, 380 230, 560 190 S 920 150, 1080 190 L1080 300 L0 300 Z" fill="rgba(255,255,255,.06)"/>
  </svg>

  <div id="brand">
    <div class="tile"><div class="ic"><img src="../../dictionary/ico/icon-512.png" alt=""></div></div>
    <div><b>MALU</b><span>辞書検索アプリ</span></div>
  </div>

  <div id="head">どの辞書も、<br><em>ひとつの検索で。</em></div>
  <div id="sub">無料・登録なしで、今すぐ使える</div>

  <div id="card">
    <div id="search"><span class="msr">search</span><b>serendipity</b><i></i></div>
    <div id="cats"><span class="cat">国語</span><span class="cat on">英語</span><span class="cat">韓国語</span><span class="cat">中国語</span></div>
    <div id="dicts">
      <div class="dict on">Oxford<span class="msr">open_in_new</span></div>
      <div class="dict">Cambridge<span class="msr">open_in_new</span></div>
      <div class="dict">Longman<span class="msr">open_in_new</span></div>
      <div class="dict">Macmillan<span class="msr">open_in_new</span></div>
    </div>
  </div>

  <div id="count">
    <small>引ける辞書・翻訳サイト</small>
    <strong>20<i>サイト</i></strong>
    <p><span class="msr">category</span>6 つのカテゴリ</p>
  </div>

  <div id="feats">
    <div class="feat"><span class="msr">search</span>ことばを入れて選ぶだけ</div>
    <div class="feat"><span class="msr">translate</span>国語・英語・韓国語・中国語</div>
    <div class="feat"><span class="msr">install_mobile</span>アプリのように使える</div>
  </div>

  <div id="cta">
    <div id="url"><span class="msr">open_in_new</span>sy9-k.github.io/dictionary</div>
  </div>
</div>
</body>
</html>
