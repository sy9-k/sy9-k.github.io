<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SK's Toolbox Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,500,1,0&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "M PLUS 1", "Hiragino Sans", sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  #bg { position: absolute; inset: 0; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .tile { position: absolute; left: 0; top: 0; }
  .center-x { left: 0; width: 1080px; text-align: center; }
  .msr { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; font-feature-settings: "liga"; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; }

  #brand { display: flex; align-items: center; gap: 20px; font-size: 44px; font-weight: 700; letter-spacing: .01em; }
  #brand-logo { width: 72px; height: 72px; flex: none; }

  #title { font-size: 132px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  #tagline { font-size: 54px; font-weight: 500; line-height: 1.55; opacity: .92; }

  .app { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; }
  .app__icon { display: block; width: 420px; height: 420px; margin: 0 auto; border-radius: 96px; box-shadow: 0 40px 90px -20px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.12) inset; }
  .app__name { margin-top: 70px; font-size: 128px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  .app__catch { margin-top: 26px; font-size: 58px; font-weight: 700; line-height: 1.4; }
  .app__chips { margin-top: 48px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 0 80px; }
  .chip { padding: 16px 34px; border-radius: 999px; background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.22); font-size: 40px; font-weight: 500; }

  #dots { display: flex; gap: 16px; }
  .dot { height: 16px; width: 16px; border-radius: 8px; background: rgba(255,255,255,.35); }

  #feat-head { font-size: 96px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; }
  .feat { position: absolute; left: 90px; width: 900px; height: 190px; border-radius: 56px; display: flex; align-items: center; gap: 36px; padding: 0 44px; box-sizing: border-box;
    background: rgba(255,255,255,.11); border: 2px solid rgba(255,255,255,.16); }
  .feat__ic { width: 112px; height: 112px; border-radius: 36px; display: grid; place-items: center; flex: none; font-size: 64px; color: #fff; }
  .feat__tx { font-size: 50px; font-weight: 700; line-height: 1.3; }

  .grid-icon { position: absolute; left: 0; top: 0; width: 190px; height: 190px; border-radius: 46px; box-shadow: 0 24px 50px -16px rgba(0,0,0,.5); }
  #cta-title { font-size: 128px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
  #cta-sub { font-size: 50px; font-weight: 500; line-height: 1.5; opacity: .92; }
  #cta-url { display: inline-flex; align-items: center; gap: 18px; padding: 30px 54px; border-radius: 999px; background: #fff; color: #1c2347; font-size: 54px; font-weight: 800; letter-spacing: .01em; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5); }
  #cta-url .msr { font-size: 60px; }
  #cta-hint { font-size: 40px; font-weight: 500; opacity: .8; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="glow" id="glowA"></div>
  <div class="glow" id="glowB"></div>

  <!-- ロゴの 4 つのタイル（表紙では大きく、あとは上のブランドのマークになる） -->
  <div id="tiles"></div>
  <div class="abs" id="brand"><div id="brand-logo"></div><span id="brand-text">SK's Toolbox</span></div>

  <div class="abs center-x" id="title">SK's Toolbox</div>
  <div class="abs center-x" id="tagline">毎日ちょっと使う、<br>小さなアプリの道具箱。</div>

  <div id="apps"></div>
  <div class="abs" id="dots"></div>

  <div class="abs center-x" id="feat-head">ぜんぶ、<br>ブラウザだけで。</div>
  <div id="feats"></div>

  <div id="grid"></div>
  <div class="abs center-x" id="cta-title">SK's Toolbox</div>
  <div class="abs center-x" id="cta-sub">7 つのアプリが、ひとつに。</div>
  <div class="abs center-x" id="cta-url-wrap" style="text-align:center"><span id="cta-url"><span class="msr">open_in_new</span>sy9-k.github.io/toolbox</span></div>
  <div class="abs center-x" id="cta-hint">ホーム画面に追加すると、アプリのように使えます</div>
</div>

<script>
const W = 1080, H = 1920;
const $ = (id) => document.getElementById(id);

// ---- データ ----
const BASE = { top: "#1c2347", bot: "#2d3a73", glow: "#e5793f", glow2: "#415f91" };
const APPS = [
  { id: "clock",     name: "Clock",     catch: "空の色が、時間で変わる時計",   chips: ["アラーム", "タイマー", "世界時計"],     top: "#1f2463", bot: "#6a4c9c", glow: "#f59a7c", glow2: "#6a4c9c" },
  { id: "calc",      name: "Calc",      catch: "すっきり見やすい電卓",         chips: ["関数電卓", "計算の履歴"],              top: "#0b2f38", bot: "#14857a", glow: "#7cf5df", glow2: "#0d3b45" },
  { id: "memo",      name: "Memo",      catch: "画像も表も入るメモ帳",         chips: ["チェックリスト", "フォルダ", "書式"],   top: "#4a220c", bot: "#c4622c", glow: "#f7c873", glow2: "#e5793f" },
  { id: "todo",      name: "Todo",      catch: "やることを、忘れない",         chips: ["繰り返し", "サブタスク", "優先度"],     top: "#123520", bot: "#2f7d4a", glow: "#9ad35f", glow2: "#2f7d4a" },
  { id: "countdown", name: "Countdown", catch: "大事な日まで、あと何日？",     chips: ["誕生日", "テスト", "旅行"],            top: "#2e1460", bot: "#9b2c6d", glow: "#f0abfc", glow2: "#8b5cf6" },
  { id: "timetable", name: "Timetable", catch: "いまの授業が、すぐ分かる",     chips: ["次の授業", "クラスに配信"],            top: "#0c2a62", bot: "#2563eb", glow: "#22c3e6", glow2: "#2563eb" },
  { id: "roulette",  name: "Roulette",  catch: "迷ったら、回して決めよう",     chips: ["順番決め", "当番", "ごはん"],          top: "#4d0c2b", bot: "#be185d", glow: "#f9a8d4", glow2: "#f472b6" },
];
const FEATS = [
  { ic: "install_mobile", tx: "ホーム画面に追加して、<br>アプリのように", c: "#415f91" },
  { ic: "wifi_off",       tx: "オフラインでも使える",                    c: "#2f7d4a" },
  { ic: "shield_lock",    tx: "データは、この端末に保存",                c: "#e5793f" },
];
const TILE_GRAD = [
  "linear-gradient(180deg,#3b3f8f,#f59a7c)",
  "linear-gradient(135deg,#2a8f9a,#5eead4)",
  "linear-gradient(135deg,#f7c873,#e5793f)",
  "linear-gradient(135deg,#9ad35f,#2f7d4a)",
];

// ---- タイムライン（秒） ----
const S2 = 3.0, T = 1.35, D = 0.5;         // アプリの紹介: 1 つ T 秒、切りかえ D 秒
const S3 = S2 + APPS.length * T;           // 特徴
const S4 = S3 + 3.2;                       // 最後の案内
const DURATION = S4 + 4.4;
window.DURATION = DURATION;
window.MARKS = { cover: 2.4, apps: APPS.map((_, i) => S2 + i * T + 0.95), feats: S3 + 2.7, cta: DURATION - 0.1 };

// ---- イージング ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eIn = (x) => x * x * x;
const eInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, x) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], x))).join(",")})`; };
const mixObj = (a, b, x) => ({ top: mix(a.top, b.top, x), bot: mix(a.bot, b.bot, x), glow: mix(a.glow, b.glow, x), glow2: mix(a.glow2, b.glow2, x) });
const toHexObj = (o) => o; // mix は rgb() を返すので、そのまま使う
const set = (el, x, y, s = 1, o = 1, r = 0) => { el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; el.style.opacity = o; };

// ---- 組み立て ----
const tiles = [];
for (let i = 0; i < 4; i++) {
  const d = document.createElement("div");
  d.className = "tile";
  d.style.background = TILE_GRAD[i];
  $("tiles").appendChild(d);
  tiles.push(d);
}
const appEls = APPS.map((a) => {
  const el = document.createElement("div");
  el.className = "app";
  el.innerHTML = `<img class="app__icon" src="icons/${a.id}.svg" alt=""><div class="app__name">${a.name}</div><div class="app__catch">${a.catch}</div><div class="app__chips">${a.chips.map((c) => `<span class="chip">${c}</span>`).join("")}</div>`;
  $("apps").appendChild(el);
  return { el, icon: el.querySelector(".app__icon"), name: el.querySelector(".app__name"), cat: el.querySelector(".app__catch"), chips: el.querySelector(".app__chips") };
});
const dots = APPS.map(() => { const d = document.createElement("div"); d.className = "dot"; $("dots").appendChild(d); return d; });
const featEls = FEATS.map((f) => {
  const el = document.createElement("div");
  el.className = "feat abs";
  el.innerHTML = `<div class="feat__ic msr" style="background:${f.c}">${f.ic}</div><div class="feat__tx">${f.tx}</div>`;
  $("feats").appendChild(el);
  return el;
});
const gridEls = APPS.map((a) => { const im = document.createElement("img"); im.className = "grid-icon"; im.src = `icons/${a.id}.svg`; $("grid").appendChild(im); return im; });

// ブランドのマーク（上）の位置。タイルは表紙からここへ移る
let brandX = 0, BRAND_Y = 290;
function layout() {
  const b = $("brand");
  b.style.transform = "none";
  const w = b.getBoundingClientRect().width;
  brandX = (W - w) / 2;
}

// ロゴのタイルの位置（中心 cx, cy・全体の大きさ size）
function tileRects(cx, cy, size) {
  const t = size * 118 / 260, g = size * 24 / 260; // アイコンの比率（118 のタイル・24 のすきま）
  const o = (t + g) / 2;
  return [[-o, -o], [o, -o], [-o, o], [o, o]].map(([dx, dy]) => ({ x: cx + dx - t / 2, y: cy + dy - t / 2, s: t }));
}

function render(t) {
  // ---- 背景の色 ----
  let pal = BASE;
  if (t >= S2 - 0.2) {
    const f = (t - (S2 - 0.2)) / T;
    const i = Math.floor(f), fr = (t - (S2 - 0.2)) - i * T;
    const x = eInOut(clamp(fr / D));
    if (i < APPS.length) pal = mixObj(i === 0 ? BASE : APPS[i - 1], APPS[i], x);
    else pal = mixObj(APPS[APPS.length - 1], BASE, eInOut(prog(t, S3 - 0.2, S3 + 0.5)));
  }
  $("bg").style.background = `linear-gradient(170deg, ${pal.top} 0%, ${pal.bot} 100%)`;
  const gA = $("glowA"), gB = $("glowB");
  gA.style.cssText = `width:900px;height:900px;background:${pal.glow};opacity:.42;transform:translate(${-260 + 90 * Math.sin(t * .5)}px,${1180 + 80 * Math.cos(t * .4)}px)`;
  gB.style.cssText = `width:800px;height:800px;background:${pal.glow2};opacity:.55;transform:translate(${520 + 80 * Math.cos(t * .45)}px,${-180 + 90 * Math.sin(t * .35)}px)`;

  // ---- 1. 表紙 ----
  const big = tileRects(W / 2, 760, 400);
  const small = tileRects(brandX + 36, BRAND_Y + 36, 72);
  const corners = [[-500, -600, -40], [W + 300, -500, 50], [-450, H + 200, 60], [W + 350, H + 300, -50]];
  const toTop = eInOut(prog(t, 2.55, 3.15));
  const ctaOut = eIn(prog(t, S4 - 0.1, S4 + 0.3));
  tiles.forEach((el, i) => {
    const p = eBack(prog(t, 0.1 + i * 0.1, 0.95 + i * 0.1));
    const c = corners[i], b = big[i], s = small[i];
    let x = lerp(c[0], b.x, p), y = lerp(c[1], b.y, p), sz = b.s, r = lerp(c[2], 0, clamp(p));
    x = lerp(x, s.x, toTop); y = lerp(y, s.y, toTop); sz = lerp(sz, s.s, toTop);
    const breathe = 1 + 0.015 * Math.sin(t * 4 + i) * (1 - toTop) * prog(t, 1, 1.4);
    el.style.width = el.style.height = sz + "px";
    el.style.borderRadius = (i === 3 ? sz / 2 : sz * 34 / 118) + "px";
    set(el, x, y, breathe, (1 - ctaOut) * clamp(p * 3), r);
  });
  const brandTxt = eOut(prog(t, 3.0, 3.5));
  $("brand").style.transform = `translate(${brandX}px,${BRAND_Y}px)`;
  $("brand").style.opacity = 1;
  $("brand-text").style.opacity = brandTxt * (1 - ctaOut);
  $("brand-text").style.transform = `translateX(${(1 - brandTxt) * -20}px)`;

  const ti = eOut(prog(t, 1.0, 1.6)), out1 = eIn(prog(t, 2.5, 2.9));
  set($("title"), 0, 1060 + (1 - ti) * 60 - out1 * 40, 1, ti * (1 - out1));
  const tg = eOut(prog(t, 1.3, 1.9));
  set($("tagline"), 0, 1240 + (1 - tg) * 60 - out1 * 40, 1, tg * (1 - out1));

  // ---- 2. アプリ ----
  appEls.forEach((a, i) => {
    const s = S2 + i * T - 0.2;
    const pin = eOut(prog(t, s, s + D)), pout = eIn(prog(t, s + T, s + T + D * .8));
    const visible = t > s - 0.05 && t < s + T + D;
    a.el.style.display = visible ? "block" : "none";
    if (!visible) return;
    const ic = eBack(prog(t, s, s + D + .1));
    set(a.el, 0, 560, 1, 1);
    a.icon.style.transform = `translate(${(1 - pin) * 520 - pout * 620}px, ${(1 - pin) * 40}px) rotate(${(1 - pin) * 14 - pout * 10}deg) scale(${lerp(.55, 1, ic) * (1 - pout * .25)})`;
    a.icon.style.opacity = clamp(pin * 2) * (1 - pout);
    [[a.name, .06], [a.cat, .12], [a.chips, .18]].forEach(([el, dl]) => {
      // 入る文字は前の文字が消えてから（i > 0 のとき 0.2 秒遅らせる）。出る文字は短く消す
      const ds = i > 0 ? .2 : 0;
      const pi = eOut(prog(t, s + ds + dl, s + ds + dl + D)), po = prog(t, s + T + dl * .3, s + T + dl * .3 + .24);
      el.style.transform = `translateX(${(1 - pi) * 380 - eIn(po) * 240}px)`;
      el.style.opacity = pi * (1 - eOut(po));
    });
  });
  const dIn = eOut(prog(t, S2, S2 + .4)), dOut = eIn(prog(t, S3 - .1, S3 + .3));
  const fi = Math.floor((t - (S2 - 0.2)) / T);
  const fpos = clamp(fi - 1 + eInOut(clamp((t - (S2 - 0.2) - fi * T) / D)), 0, APPS.length - 1);
  dots.forEach((d, i) => {
    const near = clamp(1 - Math.abs(fpos - i));
    d.style.width = (16 + 40 * near) + "px";
    d.style.background = `rgba(255,255,255,${.35 + .65 * near})`;
  });
  const dw = 16 * APPS.length + 16 * (APPS.length - 1) + 40;
  set($("dots"), (W - dw) / 2, 1560 + (1 - dIn) * 30, 1, dIn * (1 - dOut));

  // ---- 3. 特徴 ----
  const fh = eOut(prog(t, S3 + .15, S3 + .7)), fo = eIn(prog(t, S4 - .35, S4 + .05));
  set($("feat-head"), 0, 520 + (1 - fh) * 60 - fo * 40, 1, fh * (1 - fo));
  featEls.forEach((el, i) => {
    const p = eBack(prog(t, S3 + .5 + i * .2, S3 + 1.1 + i * .2));
    const po = eIn(prog(t, S4 - .35 + i * .05, S4 + .05 + i * .05));
    set(el, 90 + (1 - p) * 120, 860 + i * 230 + (1 - clamp(p)) * 30, lerp(.9, 1, p), clamp(p * 2) * (1 - po));
  });

  // ---- 4. 最後の案内 ----
  const gsz = 190, gap = 34;
  const rows = [[0, 1, 2, 3], [4, 5, 6]];
  rows.forEach((row, r) => {
    const rw = row.length * gsz + (row.length - 1) * gap;
    row.forEach((ai, k) => {
      const el = gridEls[ai];
      const n = ai;
      const p = eBack(prog(t, S4 + .1 + n * .07, S4 + .65 + n * .07));
      const fl = Math.sin(t * 1.6 + n * .9) * 8 * prog(t, S4 + 1.2, S4 + 2);
      set(el, (W - rw) / 2 + k * (gsz + gap), 420 + r * (gsz + gap) + fl + (1 - clamp(p)) * 80, lerp(.4, 1, p), clamp(p * 2), (1 - clamp(p)) * (n % 2 ? 20 : -20));
    });
  });
  const c1 = eOut(prog(t, S4 + .55, S4 + 1.1));
  set($("cta-title"), 0, 930 + (1 - c1) * 50, 1, c1);
  const c2 = eOut(prog(t, S4 + .75, S4 + 1.3));
  set($("cta-sub"), 0, 1090 + (1 - c2) * 50, 1, c2);
  const c3 = eBack(prog(t, S4 + 1.0, S4 + 1.6));
  const pulse = 1 + 0.025 * Math.max(0, Math.sin((t - S4 - 1.8) * 3.2)) * prog(t, S4 + 1.8, S4 + 2.2);
  set($("cta-url-wrap"), 0, 1250 + (1 - clamp(c3)) * 40, lerp(.85, 1, c3) * pulse, clamp(c3 * 2));
  const c4 = eOut(prog(t, S4 + 1.3, S4 + 1.8));
  set($("cta-hint"), 0, 1440 + (1 - c4) * 30, 1, c4 * .85);
}

window.render = render;
window.ready = (async () => { await document.fonts.ready; await Promise.all([...document.images].map((im) => im.decode().catch(() => {}))); layout(); render(0); return true; })();

// ブラウザで開いたときは再生する（?t=秒 でその時点に止める）
if (!new URLSearchParams(location.search).has("capture")) {
  const q = new URLSearchParams(location.search);
  window.ready.then(() => {
    if (q.has("t")) return render(+q.get("t"));
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
</html>
