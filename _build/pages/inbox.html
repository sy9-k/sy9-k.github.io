    <section class="p-hero band band--plain inbox-hero">
      <div class="wrap">
        <span class="eyebrow">Inbox</span>
        <h1>お問い合わせの受信箱</h1>
        <p class="lead">お問い合わせフォームから届いた内容です。開発者の SK Hub Systems アカウントだけが読めます。</p>
      </div>
    </section>

    <section class="section" style="padding-top:0" data-inbox>
      <div class="wrap">
        <div class="card acct-loading" data-inbox-view="loading">読み込み中…</div>

        <div class="card inbox-gate" data-inbox-view="signed-out" hidden>
          <h2>ログインしてください</h2>
          <p>開発者の SK Hub Systems アカウントでログインすると、お問い合わせを読めます。</p>
          <button class="acct-google" type="button" data-inbox-signin>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Google でログイン
          </button>
          <p class="acct-msg" data-inbox-msg role="alert"></p>
        </div>

        <div class="card inbox-gate" data-inbox-view="denied" hidden>
          <h2>このページは開発者専用です</h2>
          <p>ログインしているアカウント（<span data-inbox-email></span>）には、お問い合わせを読む権限がありません。</p>
          <div class="btn-row"><button class="btn btn-tonal" type="button" data-inbox-signout>別のアカウントでログイン</button></div>
        </div>

        <div data-inbox-view="ready" hidden>
          <div class="inbox-toolbar">
            <div class="help-tabs" role="tablist" aria-label="表示するお問い合わせ">
              <button type="button" role="tab" data-inbox-filter="new" aria-selected="true">未対応 <span data-inbox-count="new"></span></button>
              <button type="button" role="tab" data-inbox-filter="done" aria-selected="false">対応済み <span data-inbox-count="done"></span></button>
              <button type="button" role="tab" data-inbox-filter="" aria-selected="false">すべて</button>
            </div>
            <p class="inbox-hint">対応済みにしたものは 1 年後に、アクセスチェックの記録は 1 年を過ぎると、このページを開いたときに削除されます。</p>
          </div>
          <div class="inbox-list" data-inbox-list aria-live="polite"></div>
        </div>
      </div>
    </section>
