<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="複数の言語辞書に対応した検索アプリケーション" />
<meta name="theme-color" content="#2563eb" />
<title>Online Dictionary</title>
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="ico/icon-192.png" />
<link rel="apple-touch-icon" href="ico/icon-192.png" />
</head>
<body>
  <div id="install-banner" class="install-banner hide" role="dialog" aria-live="polite">
    <div class="install-banner__inner">
      <p class="install-banner__text">ホーム画面に追加できます。</p>
      <div class="install-banner__actions">
        <button id="install-button" type="button" class="install-banner__button">追加</button>
        <button id="install-dismiss" type="button" class="install-banner__dismiss">閉じる</button>
      </div>
    </div>
  </div>

  <div class="wrapper">
    <header class="header">
      <nav class="nav-global-wrap">
        <ul class="nav-global">
          <li class="item"><p class="nav-text"><button class="nav-link category-tab active" type="button" data-category="kokugo">国語辞書</button></p></li>
          <li class="item"><p class="nav-text"><button class="nav-link category-tab" type="button" data-category="eigo">英語辞書</button></p></li>
          <li class="item"><p class="nav-text"><button class="nav-link category-tab" type="button" data-category="kankoku">韓国語辞書</button></p></li>
          <li class="item"><p class="nav-text"><button class="nav-link category-tab" type="button" data-category="chinese">中国語辞典</button></p></li>
          <li class="item"><p class="nav-text"><button class="nav-link category-tab" type="button" data-category="eij">英和・和英辞典</button></p></li>
          <li class="item"><p class="nav-text"><button class="nav-link category-tab" type="button" data-category="nikankoku">日韓・韓日辞典</button></p></li>
        </ul>
      </nav>

      <div class="time-banner">
        <p class="time-label" id="current-date">--年--月--日 --曜日</p>
        <p class="time-value" id="current-time">--:--</p>
      </div>
      <div class="header-actions">
        <button id="settings-button" type="button" class="settings-button">⚙ 設定</button>
      </div>
    </header>

    <section class="search-area">
      <div class="search-area-inner">
        <p class="search-area-title">調べたいことばを検索しよう</p>
        <form id="dictionary-form" action="#" method="get">
          <div class="dictionary-panel">
            <div class="form-group">
              <div class="input-group">
                <input id="query-input" type="text" maxlength="2048" name="query" class="form-control form-search" placeholder="言葉を入力して検索する" autocomplete="off" autofocus>
                <div class="input-group-append">
                  <button class="btn-search" type="submit" aria-label="検索"><span class="ico-search">🔍</span></button>
                </div>
              </div>
            </div>
          </div>
        </form>
        <div class="dictionary-select" id="dictionary-select-row" role="group" aria-label="辞書選択"></div>
        <div class="search-history" id="search-history" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <div id="settings-overlay" class="settings-overlay hide" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel">
      <div class="settings-panel__header">
        <h2 id="settings-title">設定</h2>
        <button id="settings-close" type="button" class="settings-close" aria-label="閉じる">×</button>
      </div>
      <div class="settings-panel__body">
        <div class="settings-item">
          <div>
            <p class="settings-item__title">デフォルト辞書</p>
            <p class="settings-item__description">検索開始時に最初に選択される辞書を設定します。</p>
          </div>
          <select id="default-dictionary" class="settings-select"></select>
        </div>
        <div class="settings-item">
          <div>
            <p class="settings-item__title">結果表示</p>
            <p class="settings-item__description">検索結果を開く方法を選択します。</p>
          </div>
          <div class="settings-mode">
            <label><input type="radio" name="open-mode" value="new" /> 新しいタブ</label>
            <label><input type="radio" name="open-mode" value="same" /> 同じタブ</label>
          </div>
        </div>
        <div class="settings-item">
          <div>
            <p class="settings-item__title">検索履歴</p>
            <p class="settings-item__description">保存している検索履歴を削除します。</p>
          </div>
          <button id="clear-history" type="button" class="settings-action">履歴を消去</button>
        </div>
        <div class="settings-item">
          <div>
            <p class="settings-item__title">キャッシュ</p>
            <p class="settings-item__description">Service Worker キャッシュをクリアして再読み込みします。</p>
          </div>
          <button id="reset-cache" type="button" class="settings-action">再読み込み</button>
        </div>
        <div class="settings-item settings-item--status">
          <div>
            <p class="settings-item__title">ネットワーク状態</p>
            <p id="network-status" class="settings-item__description">現在: オンライン</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="offline-overlay" class="offline-overlay hide" role="status" aria-live="polite">
    <div class="offline-overlay__content">
      <p class="offline-overlay__title">オフライン中です</p>
      <p class="offline-overlay__description">辞書は使えません。ネットワークに接続してから再度お試しください。</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
